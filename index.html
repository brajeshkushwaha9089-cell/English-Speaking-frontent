<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Bolo – English Speaking Partner</title>
    <script src="config.local.js"></script>
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #fff;
        --tx: #1b1f2a;
        --mu: #6b7285;
        --pr: #5b5bf0;
        --pr2: #eceafe;
        --ok: #12a36a;
        --bad: #e5484d;
        --bd: #e4e6ee;
        --warn: #d97706;
        --warn-bg: #fffbeb;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f1117;
          --card: #181b25;
          --tx: #eef0f6;
          --mu: #98a0b5;
          --pr: #8b8bff;
          --pr2: #23234a;
          --bd: #2a2e3d;
          --warn: #fbbf24;
          --warn-bg: #2b2311;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f1117;
        --card: #181b25;
        --tx: #eef0f6;
        --mu: #98a0b5;
        --pr: #8b8bff;
        --pr2: #23234a;
        --bd: #2a2e3d;
        --warn: #fbbf24;
        --warn-bg: #2b2311;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #app {
        max-width: 480px;
        margin: 0 auto;
        padding: 16px 16px 90px;
        min-height: 100vh;
      }
      h1 {
        font-size: 24px;
        margin: 8px 0;
      }
      h2 {
        font-size: 19px;
        margin: 0 0 8px;
      }
      p {
        margin: 6px 0;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 18px;
        padding: 16px;
        margin: 12px 0;
      }
      .mu {
        color: var(--mu);
        font-size: 14px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 14px;
        padding: 14px 16px;
        background: var(--pr);
        color: #fff;
        font-weight: 600;
        transition: transform 0.1s, opacity 0.1s;
      }
      button:active {
        transform: scale(0.98);
      }
      button.s {
        background: var(--pr2);
        color: var(--pr);
      }
      button.g {
        background: transparent;
        color: var(--mu);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .grid button {
        padding: 18px 8px;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        margin: 8px 0;
        background: var(--card);
        color: var(--tx);
        border: 1.5px solid var(--bd);
      }
      .opt.on {
        border-color: var(--pr);
        background: var(--pr2);
      }
      .big {
        font-size: 22px;
        font-weight: 700;
      }
      .pron {
        color: var(--pr);
        font-size: 14px;
        font-weight: 500;
      }
      .mic {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        font-size: 38px;
        display: block;
        margin: 14px auto 6px;
        padding: 0;
        box-shadow: 0 4px 14px rgba(91, 91, 240, 0.3);
      }
      .mic.rec {
        background: var(--bad);
        box-shadow: 0 0 20px rgba(229, 72, 77, 0.6);
        animation: p 1s infinite;
      }
      @keyframes p {
        50% {
          transform: scale(1.08);
        }
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row > * {
        flex: 1;
      }
      .bub {
        padding: 10px 14px;
        border-radius: 16px;
        margin: 8px 0;
        max-width: 88%;
      }
      .ai {
        background: var(--pr2);
      }
      .me {
        background: var(--pr);
        color: #fff;
        margin-left: auto;
      }
      .fix {
        border-left: 4px solid var(--ok);
        padding: 8px 12px;
        background: var(--card);
        border-radius: 10px;
        margin: 6px 0;
        font-size: 15px;
      }
      nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--card);
        border-top: 1px solid var(--bd);
        display: flex;
        justify-content: space-around;
        padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
        z-index: 100;
      }
      nav button {
        background: none;
        color: var(--mu);
        padding: 6px 8px;
        font-size: 11px;
      }
      nav button.on {
        color: var(--pr);
      }
      input,
      textarea,
      select {
        width: 100%;
        font: inherit;
        padding: 12px;
        border-radius: 12px;
        border: 1.5px solid var(--bd);
        background: var(--card);
        color: var(--tx);
      }
      .bar {
        height: 10px;
        background: var(--pr2);
        border-radius: 9px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--pr);
      }
      .stat {
        text-align: center;
      }
      .stat b {
        font-size: 24px;
        display: block;
      }
      .days {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
      }
      .days span {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--pr2);
        font-size: 13px;
      }
      .days .d {
        background: var(--ok);
        color: #fff;
      }
      .days .t {
        outline: 2px solid var(--pr);
      }
      /* Components */
      .pills {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 4px 0 8px;
        -webkit-overflow-scrolling: touch;
      }
      .pills::-webkit-scrollbar {
        height: 4px;
      }
      .pills::-webkit-scrollbar-thumb {
        background: var(--bd);
        border-radius: 4px;
      }
      .pill {
        flex-shrink: 0;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
        border: 1.5px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        cursor: pointer;
      }
      .pill.active {
        background: var(--pr);
        color: #fff;
        border-color: var(--pr);
        font-weight: 600;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 12px;
        background: var(--pr2);
        color: var(--pr);
        font-weight: 600;
      }
      .mic-banner {
        background: var(--warn-bg);
        color: var(--warn);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 10px 14px;
        margin: 10px 0;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        padding: 16px;
      }
      .modal {
        background: var(--card);
        border-radius: 20px;
        max-width: 440px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        padding: 20px;
        border: 1px solid var(--bd);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      .quiz-card {
        min-height: 180px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        border: 2px dashed var(--pr);
        border-radius: 18px;
        padding: 20px;
        margin: 14px 0;
        cursor: pointer;
        background: var(--card);
      }
      .story-box {
        border-left: 4px solid var(--pr);
        padding: 12px 14px;
        margin: 10px 0;
        background: var(--card);
        border-radius: 12px;
      }

      /* LIVE VOICE CALL BOT STYLES */
      .voice-call-screen {
        min-height: calc(100vh - 120px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        text-align: center;
        padding: 8px 0;
      }
      .voice-orb-container {
        position: relative;
        width: 180px;
        height: 180px;
        margin: 18px auto 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .voice-orb {
        width: 136px;
        height: 136px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--pr), #905bf0);
        box-shadow: 0 0 35px rgba(91, 91, 240, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 58px;
        transition: all 0.3s ease;
        user-select: none;
        cursor: pointer;
      }
      .voice-orb.listening {
        background: linear-gradient(135deg, #e5484d, #f76808);
        box-shadow: 0 0 50px rgba(229, 72, 77, 0.7);
        animation: orb-pulse 1.1s infinite ease-in-out;
      }
      .voice-orb.speaking {
        background: linear-gradient(135deg, #12a36a, #20c997);
        box-shadow: 0 0 50px rgba(18, 163, 106, 0.7);
        animation: orb-speak 0.85s infinite alternate;
      }
      .voice-orb.thinking {
        background: linear-gradient(135deg, #8b5cf6, #3b82f6);
        box-shadow: 0 0 50px rgba(139, 92, 246, 0.7);
        animation: orb-think 1.4s infinite linear;
      }
      .voice-orb.paused {
        background: linear-gradient(135deg, #64748b, #475569);
        box-shadow: 0 0 20px rgba(100, 116, 139, 0.4);
      }
      @keyframes orb-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.14); }
      }
      @keyframes orb-speak {
        0% { transform: scale(0.96); }
        100% { transform: scale(1.10); }
      }
      @keyframes orb-think {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.07); }
        100% { transform: rotate(360deg) scale(1); }
      }
      .wave-bars {
        display: flex;
        gap: 5px;
        align-items: center;
        justify-content: center;
        height: 30px;
        margin: 8px 0;
      }
      .wave-bar {
        width: 4px;
        background: var(--ok);
        border-radius: 4px;
        animation: wave-bar-anim 0.85s infinite ease-in-out;
      }
      .wave-bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
      .wave-bar:nth-child(2) { height: 22px; animation-delay: 0.2s; }
      .wave-bar:nth-child(3) { height: 30px; animation-delay: 0.3s; }
      .wave-bar:nth-child(4) { height: 18px; animation-delay: 0.4s; }
      .wave-bar:nth-child(5) { height: 26px; animation-delay: 0.15s; }
      .wave-bar:nth-child(6) { height: 14px; animation-delay: 0.25s; }
      @keyframes wave-bar-anim {
        0%, 100% { transform: scaleY(0.4); }
        50% { transform: scaleY(1.35); }
      }
      .call-transcript-box {
        width: 100%;
        max-height: 180px;
        overflow-y: auto;
        padding: 12px 14px;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 16px;
        text-align: left;
        margin: 10px 0;
        font-size: 14.5px;
      }
      .call-ctrl-bar {
        display: flex;
        gap: 14px;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-top: 14px;
      }
      .call-btn-circle {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        padding: 0;
        display: grid;
        place-items: center;
        font-size: 26px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      }
      .call-btn-circle.end {
        background: var(--bad);
        color: #fff;
        box-shadow: 0 4px 20px rgba(229, 72, 77, 0.4);
      }
      .partner-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px;
        border-radius: 16px;
        border: 1.5px solid var(--bd);
        margin: 10px 0;
        cursor: pointer;
        text-align: left;
        background: var(--card);
        transition: all 0.2s ease;
      }
      .partner-card.selected {
        border-color: var(--pr);
        background: var(--pr2);
      }
    </style>
  </head>
  <body>
    <div id="banner-area"></div>
    <div id="app"></div>
    <nav id="nav"></nav>
    <div id="modal-root"></div>

    <script>
      const $ = (s) => document.querySelector(s),
        A = $("#app");
      const K = "bolo1";

      // ---------- Supabase Cloud Configuration ----------
      const localCfg = (typeof window !== "undefined" && window.LOCAL_CONFIG) || {};
      const SUPABASE_CONFIG = {
        url: localCfg.supabaseUrl || "https://jyatlsllsdmtdmvohhfz.supabase.co",
        publishableKey: localCfg.supabasePublishableKey || "",
        secretKey: localCfg.supabaseSecretKey || "",
        bucket: "bolo_cloud",
      };

      let S = {
        name: "",
        level: -1,
        goal: "",
        streak: 0,
        last: "",
        secs: 0,
        convos: 0,
        sent: 0,
        words: [],
        customWords: [],
        geminiKey: localCfg.geminiKey || "",
        backendUrl: localCfg.backendUrl || "",
        aiMode: "gemini",
        userId: "brajesh_main",
        lastCloudSync: null,
        mist: [],
        theme: "auto",
        done: {},
      };

      try {
        Object.assign(S, JSON.parse(localStorage.getItem(K) || "{}"));
      } catch (e) {}

      if (!S.geminiKey && localCfg.geminiKey) S.geminiKey = localCfg.geminiKey;
      if (!S.backendUrl && localCfg.backendUrl) S.backendUrl = localCfg.backendUrl;
      if (!S.aiMode) S.aiMode = "gemini";
      if (!S.userId) S.userId = "brajesh_main";
      if (!Array.isArray(S.customWords)) S.customWords = [];

      function getApiUrl(endpoint) {
        const custom = S.backendUrl || (window.LOCAL_CONFIG && window.LOCAL_CONFIG.backendUrl);
        if (custom) return custom.replace(/\/+$/, "") + endpoint;
        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
          return (window.location.port === "8000" ? "" : "http://localhost:8000") + endpoint;
        }
        return endpoint;
      }

      function saveLocalOnly() {
        try {
          localStorage.setItem(K, JSON.stringify(S));
        } catch (e) {}
      }

      // Automatic background sync to Supabase Cloud
      let cloudSyncTimer = null;
      async function syncToSupabaseCloud() {
        try {
          const userId = S.userId || "brajesh_main";
          const payload = {
            userId: userId,
            data: {
              ...S,
              syncedAt: new Date().toISOString()
            }
          };

          if (window.location.protocol.startsWith("http")) {
            const res = await fetch(getApiUrl("/api/supabase/save"), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            if (res.ok) {
              S.lastCloudSync = new Date().toLocaleTimeString();
              saveLocalOnly();
              return true;
            }
          }
        } catch (e) {
          console.warn("Supabase auto-sync:", e);
        }
        return false;
      }

      async function loadFromSupabaseCloud() {
        try {
          const userId = S.userId || "brajesh_main";
          let cloudData = null;

          if (window.location.protocol.startsWith("http")) {
            try {
              const res = await fetch(getApiUrl(`/api/supabase/load?userId=${encodeURIComponent(userId)}`));
              if (res.ok) {
                cloudData = await res.json();
              }
            } catch (e) {}
          }

          if (!cloudData) {
            const pubUrl = `${SUPABASE_CONFIG.url}/storage/v1/object/public/bolo_cloud/profiles/${encodeURIComponent(userId)}.json`;
            const res = await fetch(pubUrl);
            if (res.ok) {
              cloudData = await res.json();
            }
          }

          if (cloudData) {
            Object.assign(S, cloudData);
            saveLocalOnly();
            return cloudData;
          }
        } catch (e) {
          console.warn("Supabase cloud load error:", e);
        }
        return null;
      }

      const save = () => {
        saveLocalOnly();
        if (cloudSyncTimer) clearTimeout(cloudSyncTimer);
        cloudSyncTimer = setTimeout(syncToSupabaseCloud, 1800);
      };

      const today = () => new Date().toISOString().slice(0, 10);
      function touch() {
        const t = today();
        if (S.last !== t) {
          const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
          S.streak = S.last === y ? S.streak + 1 : 1;
          S.last = t;
          save();
        }
      }
      function theme() {
        if (S.theme !== "auto")
          document.documentElement.dataset.theme = S.theme;
        else delete document.documentElement.dataset.theme;
      }
      theme();

      // Check protocol & display friendly banner if on file://
      function checkProtocolBanner() {
        const b = $("#banner-area");
        if (!b) return;
        if (window.location.protocol === "file:") {
          b.innerHTML = `
            <div style="max-width:480px;margin:8px auto 0;padding:0 16px;">
              <div class="mic-banner">
                <div>
                  <b>💡 Mic & Cloud Tips:</b> Local file par Chrome mic block kar sakta hai. <b>Run-Bolo.bat</b> se kholein!
                </div>
                <button class="s" style="padding:6px 12px;font-size:12px;white-space:nowrap" onclick="showMicHelp()">Fix Guide</button>
              </div>
            </div>`;
        } else {
          b.innerHTML = "";
        }
      }

      // ---------- Google Gemini AI API Client ----------
      async function callGeminiApi(promptText) {
        // 1. Try Backend Proxy first (production on Render / local server with safe keys)
        try {
          const proxyRes = await fetch(getApiUrl("/api/gemini/chat"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: promptText, key: S.geminiKey || "" })
          });
          if (proxyRes.ok) {
            const data = await proxyRes.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              const clean = text.replace(/```json/gi, "").replace(/```/g, "").trim();
              return JSON.parse(clean);
            }
          }
        } catch (e) {
          // Fallback to client-side direct request if backend proxy is unavailable
        }

        // 2. Client-side direct call fallback
        const key = S.geminiKey || (window.LOCAL_CONFIG && window.LOCAL_CONFIG.geminiKey) || "";
        if (!key) return null;

        const models = ["gemini-3.5-flash", "gemini-3.1-flash-lite", "gemini-3.8-flash"];
        for (const model of models) {
          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }],
                generationConfig: {
                  responseMimeType: "application/json",
                  temperature: 0.7,
                },
              }),
            });
            if (!res.ok) continue;
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              const clean = text.replace(/```json/gi, "").replace(/```/g, "").trim();
              return JSON.parse(clean);
            }
          } catch (e) {
            console.warn(`Gemini model ${model} failed:`, e);
          }
        }
        return null;
      }
      window.callGeminiApi = callGeminiApi;

      // ---------- Comprehensive Data ----------
      const WARM = [
        [
          "Tumhara naam kya hai?",
          "What is your name?",
          "व्हाट इज़ योर नेम?",
          "Tumhara naam kya hai? Jawab do: My name is ___.",
        ],
        [
          "Tum kahan se ho?",
          "Where are you from?",
          "वेयर आर यू फ्रॉम?",
          "Tum kahan se ho? Jawab: I am from ___.",
        ],
        [
          "Tum kya padh rahe ho?",
          "What are you studying?",
          "व्हाट आर यू स्टडीइंग?",
          "Jawab: I am studying B.Tech.",
        ],
        [
          "Tum kis college mein padhte ho?",
          "Which college do you study in?",
          "विच कॉलेज डू यू स्टडी इन?",
          "Jawab: I study in ___ college.",
        ],
        [
          "Tumhe kya karna pasand hai?",
          "What do you like to do?",
          "व्हाट डू यू लाइक टू डू?",
          "Jawab: I like to ___.",
        ],
      ];

      // Vocabulary Book Database (120+ Practical High-Yield Words & Phrases)
      const VOC_BOOK = [
        // Daily Life
        { w: "Wake up", h: "जागना / उठना", p: "वेक अप", c: "daily", e: "I wake up at six AM every morning.", eh: "मैं हर सुबह 6 बजे उठता हूँ।" },
        { w: "Brush", h: "दांत साफ करना", p: "ब्रश", c: "daily", e: "Don't forget to brush your teeth.", eh: "अपने दांत ब्रश करना मत भूलना।" },
        { w: "Hurry up", h: "जल्दी करना", p: "हरी अप", c: "daily", e: "Hurry up, or we will miss the bus.", eh: "जल्दी करो, नहीं तो बस छूट जाएगी।" },
        { w: "Exhausted", h: "बहुत ज्यादा थका हुआ", p: "एग्जॉस्टेड", c: "daily", e: "I am completely exhausted after college.", eh: "कॉलेज के बाद मैं पूरी तरह थक गया हूँ।" },

      // ---------- speech system ----------
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null,
        isListening = false;

      function speak(t, rate = 1, onEnd = null) {
        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(t);
          u.lang = "en-IN";
          u.rate = rate;

          if (onEnd) {
            let called = false;
            const finish = () => {
              if (!called) {
                called = true;
                onEnd();
              }
            };
            u.onend = finish;
            u.onerror = finish;
            const approxMs = Math.max(1800, (t.split(" ").length / 2) * 1000 + 1200);
            setTimeout(finish, approxMs);
          }

          speechSynthesis.speak(u);
        } catch (e) {
          if (onEnd) onEnd();
        }
      }

      function stopListening() {
        if (rec) {
          try {
            rec.stop();
          } catch (e) {
            try { rec.abort(); } catch (e2) {}
          }
          rec = null;
        }
        isListening = false;
      }

      function listen(onres, onstate) {
        if (!SR) {
          onstate("nosr");
          return;
        }

        if (isListening) {
          stopListening();
          onstate("end");
          return;
        }

        stopListening();

        try {
          rec = new SR();
          rec.lang = "en-IN";
          rec.interimResults = false;
          rec.maxAlternatives = 1;
          const t0 = Date.now();
          isListening = true;
          onstate("rec");

          rec.onresult = (e) => {
            isListening = false;
            rec = null;
            if (e.results && e.results[0] && e.results[0][0]) {
              const tx = e.results[0][0].transcript;
              S.secs += Math.max(1, Math.round((Date.now() - t0) / 1000));
              save();
              onres(tx);
            }
          };

          let er = 0;
          rec.onerror = (e) => {
            er = 1;
            isListening = false;
            rec = null;
            const code = (e && e.error) || "";
            onstate("err:" + code);

            if (window.location.protocol === "file:" && (code === "network" || code === "not-allowed")) {
              showMicFileNotice();
            }
          };

          rec.onend = () => {
            isListening = false;
            rec = null;
            if (!er) onstate("end");
          };

          rec.start();
        } catch (e) {
          isListening = false;
          rec = null;
          onstate("err:start_failed");
          if (window.location.protocol === "file:") {
            showMicFileNotice();
          }
        }
      }

        if (s.startsWith("err")) {

              return "⚠️ Local file par Chrome mic block karta hai. 'Run-Bolo.bat' se kholein ya [Win+H] se bolein.";

          if (c === "not-allowed" || c === "service-not-allowed") {
            return "Mic permission blocked hai. URL bar mein 🔒/tune icon par click karke Mic Allow karein.";
          }
          if (c === "network") {

          if (c === "audio-capture") {

      async function testMicDiagnostics() {

        out.innerHTML = "Testing system...";
        let msg = [];

        if (SR) msg.push("✅ Web Speech API: Supported in your browser");
        else msg.push("❌ Web Speech API: Not supported (Use Chrome/Edge)");

        if (window.location.protocol === "file:") {
          msg.push("⚠️ URL: Running on <b>file://</b>. Direct files have cloud speech restrictions. Run via <b>Run-Bolo.bat</b> for full functionality.");
        } else {
          msg.push("✅ URL: Running on <b>" + window.location.protocol + "//" + window.location.host + "</b> (Secure context)");
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(t => t.stop());
            msg.push("✅ Hardware Mic: Connected & permission granted!");
          } catch (e) {
            msg.push("⚠️ Hardware Mic permission: " + e.message);
          }
        }

        out.innerHTML = msg.join("<br><br>");
      }

      function startLiveCall() {
        touch();

        liveCall.mistakes = [];
        liveCall.history = [];
        liveCall.currentSpeech = "";

        if (liveCall.timerInt) clearInterval(liveCall.timerInt);
        liveCall.timerInt = setInterval(() => {
          liveCall.timerSecs++;
          updateLiveTimer();
        }, 1000);

        const bot = VOICE_BOTS[liveCall.partnerId] || VOICE_BOTS.riya;

        renderLiveCallUI();

        speak(initialGreeting, liveCall.speed * bot.voiceRate, () => {
          if (!liveCall.active || liveCall.muted) return;
          liveCall.state = "listening";
          renderLiveCallUI();
          startLiveListening();
        });
      }

      function startLiveListening() {
        if (!liveCall.active || liveCall.muted) return;
        stopListening();

        try {
          rec = new SR();
          rec.lang = "en-IN";
          rec.interimResults = true;
          rec.maxAlternatives = 1;

          let finalTx = "";
          rec.onresult = (e) => {
            let interim = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
              if (e.results[i].isFinal) {
                finalTx += e.results[i][0].transcript + " ";
              } else {
                interim += e.results[i][0].transcript;
              }
            }
            liveCall.currentSpeech = (finalTx + interim).trim();
            updateLiveSpeechDisplay();
          };

          rec.onerror = (e) => {
            const err = (e && e.error) || "";
            if (!liveCall.active) return;
            if (err === "no-speech") {
              setTimeout(() => {
                if (liveCall.active && liveCall.state === "listening") {
                  startLiveListening();
                }
              }, 350);
            } else if (err === "network" || err === "not-allowed") {
              if (window.location.protocol === "file:") {
                showMicFileNotice();
              }
            }
          };

          rec.onend = () => {
            rec = null;
            if (!liveCall.active || liveCall.muted) return;
            const said = finalTx.trim() || liveCall.currentSpeech.trim();
            if (said.length > 1) {
              processLiveUserTurn(said);
            } else if (liveCall.state === "listening") {
              setTimeout(() => {
                if (liveCall.active && liveCall.state === "listening") {
                  startLiveListening();
                }
              }, 300);
            }
          };

          rec.start();
        } catch (e) {
          if (liveCall.active) {
            setTimeout(startLiveListening, 500);
          }
        }
      }

      async function processLiveUserTurn(userSaid) {
        if (!liveCall.active) return;
        liveCall.currentSpeech = "";
        liveCall.state = "thinking";
        renderLiveCallUI();

        S.sent++;
        S.secs += 4;
        save();

        const bot = VOICE_BOTS[liveCall.partnerId] || VOICE_BOTS.riya;
        liveCall.history.push({ r: "user", t: userSaid });

        const prompt =
          bot.systemPrompt(S.name, LV[Math.min(S.level, 5)], S.goal) +
          '\n\nLive call conversation history:\n' +
          liveCall.history.slice(-8).map((m) => (m.r === "ai" ? "AI: " : "Learner: ") + m.t).join("\n") +
          "\nLearner: " +
          userSaid;

        let j = null;
        if (S.aiMode === "gemini" && S.geminiKey) {
          try {
            j = await callGeminiApi(prompt);
          } catch (e) {
            console.warn("Gemini live error:", e);
          }
        }

        if (!j) {
          await new Promise((r) => setTimeout(r, 350));
          j = generateLocalAiTurn(userSaid, liveCall.partnerId);
        }

        if (!liveCall.active) return;

        if (j.correction && j.correction.wrong) {
          addMist(j.correction.wrong, j.correction.right, j.correction.tip_hi);
          liveCall.mistakes.push(j.correction);
        }

        liveCall.lastAiReply = j.reply;
        liveCall.history.push({
          r: "ai",
          t: j.reply,
          correction: j.correction,
          hint: j.hint_hi,
        });
        liveCall.turnCount++;

        liveCall.state = "speaking";
        renderLiveCallUI();

        speak(j.reply, liveCall.speed * bot.voiceRate, () => {
          if (!liveCall.active || liveCall.muted) return;
          liveCall.state = "listening";
          renderLiveCallUI();
          startLiveListening();
        });
      }

          if (vocabFilter === "custom" && !S.customWords.some(c => c.w === item.w)) return false;

            const q = vocabSearch.toLowerCase();
            const inW = item.w.toLowerCase().includes(q);
            const inH = (item.h || "").toLowerCase().includes(q);
            const inP = (item.p || "").toLowerCase().includes(q);
            if (!inW && !inH && !inP) return false;
          }
          return true;
        });

          listDiv.innerHTML = `<div class="card" style="text-align:center"><p class="mu">No words found matching "${esc(vocabSearch)}".</p></div>`;

        if (!t) return;

          sc = sim(t, it.en),
          ok = sc >= 0.8;
        S.sent++;
        save();
        $("#fb").innerHTML = `<div class="card"><p class="mu">You said:</p><p><b>${esc(t)}</b></p>${
          ok
            ? `<p style="color:var(--ok)">✅ Good — clear and correct. Sentence saved to your practice count.</p><button style="width:100%" onclick="D.i++;D.tries=0;drillUI()">Next →</button>`

      function generateLocalAiTurn(userText, scKey) {
        const text = (userText || "").toLowerCase();

        // Common Indian Learner English Grammar Checks
        if (text.includes("i am go") || text.includes("i am come")) {
          correction = { wrong: "I am go", right: "I am going", tip_hi: "'am' ke baad verb me 'ing' lagta hai: I am going." };
        } else if (text.includes("he have") || text.includes("she have")) {
          correction = { wrong: "He/She have", right: "He/She has", tip_hi: "He/She/It ke saath hamesha 'has' use hota hai." };
        } else if (text.includes("i am agree")) {
          correction = { wrong: "I am agree", right: "I agree", tip_hi: "'Agree' khud ek kriya (verb) hai, 'am' ki zaroorat nahi hoti." };
        } else if (text.includes("didn't went") || text.includes("did not went")) {
          correction = { wrong: "did not went", right: "did not go", tip_hi: "'Did' ke saath hamesha first form of verb (go) aati hai." };
        } else if (text.includes("myself ") && text.indexOf("myself") === 0) {
          correction = { wrong: "Myself...", right: "My name is... / I am...", tip_hi: "Interview ya introduction me 'My name is' kehna zyada formal hai." };
        } else if (text.includes("today morning")) {
          correction = { wrong: "today morning", right: "this morning", tip_hi: "Aaj subah ke liye 'this morning' sahi expression hai." };
        } else if (text.includes("yesterday night")) {
          correction = { wrong: "yesterday night", right: "last night", tip_hi: "Kal raat ke liye 'last night' bolna behtar hai." };
        }

        const repliesByScenario = {
          free: [
            "That's really interesting! Tell me, what do you usually like doing on weekends?",
            "Nice to know! Which programming language do you enjoy working on the most?",
            "Sounds great! How do you spend your free time with your college friends?",
            "I see! What is your favorite movie or TV series that you watched recently?"
          ],
          riya: [
            "Totally agree! College life is hectic but fun. What subject are you studying today?",
            "That sounds awesome! Did you hang out at the canteen or library today?",
            "Haha, same here! What are your plans after classes finish?"
          ],
          vikram: [
            "Thank you for sharing that. Can you tell me about a challenging project you have worked on?",
            "Good. What are your key technical strengths, and how do you handle teamwork?",
            "Impressive. Where do you see yourself professionally in the next three years?",
            "Why do you think we should hire you for this role as a software fresher?"
          ],
          class: [
            "Yes, exactly! Have you completed the latest assignment given by the professor?",
            "I agree. Are you planning to prepare for the upcoming semester exams together?",
            "Good point! What did you think about today's morning lecture?",
            "Definitely! Let's go to the college library to study this topic."
          ],
          prof: [
            "Good question. Always make sure to write clean, modular code. What specific doubt do you have?",
            "I appreciate your curiosity. Have you gone through the textbook chapter on this concept?",
            "Very well said. Make sure to submit your lab record before the deadline."
          ],
          hr: [
            "Thank you for sharing that. Can you tell me about a challenging project you have worked on?",
            "Great! What are your key technical strengths, and how do you handle teamwork?",
            "Impressive. Where do you see yourself professionally in the next three years?"
          ],
          shop: [
            "Welcome! Would you like to see our menu or order drinks first?",
            "Sure, that will take around ten minutes. Would you like anything else with that?",
            "Certainly! Here is your bill. Would you prefer paying with UPI or cash?"
          ],
          kabir: [
            "Coming right up! Would you like sugar with your coffee or snacks?",
            "Great choice! Do you often visit this area of the city?"
          ],
          priya: [
            "Very good attempt! Every small conversation improves your confidence. What do you like doing in free time?",
            "That's wonderful! Keep speaking boldly without any fear of mistakes."
          ],
          chal: [
            "Good effort on your daily challenge speech! What was the main lesson you learned today?",
            "You spoke clearly and confidently! Keep practicing like this every day."
          ]
        };

        const pool = repliesByScenario[scKey] || repliesByScenario.free;
        const reply = pool[Math.floor(Math.random() * pool.length)];
        return { reply, correction, hint_hi: "Tip: Ek do sentences me natural jawab dein." };
      }

      async function aiTurn(userText) {
        if (C.busy) return;
        C.busy = true;
        $("#st").textContent = S.aiMode === "gemini" ? "✨ Gemini AI is thinking..." : "AI is thinking...";

        let j = null;

        // 1. Try Gemini AI Mode if active
        if (S.aiMode === "gemini" && S.geminiKey) {
          const geminiPrompt =
            sys() +
            '\n\nConversation history (learner lines start with "Learner:", you are "AI:"):\n' +
            C.msgs.map((m) => (m.r === "ai" ? "AI: " : "Learner: ") + m.t).join("\n") +
            "\nLearner: " +
            userText;

          try {
            j = await callGeminiApi(geminiPrompt);
          } catch (e) {
            console.warn("Gemini call error:", e);
          }
        }

        // 2. Try Claude sample if available
        if (!j && C.sample) {
          try {
            j = await C.sample.json(
              [
                {
                  role: "user",
                  content:
                    sys() +
                    '\n\nConversation (learner lines start with "Learner:"):\n' +
                    C.msgs
                      .map((m) => (m.r === "ai" ? "You: " : "Learner: ") + m.t)
                      .join("\n") +
                    "\nLearner: " +
                    userText,
                },
              ],
              { cache: false },
            );
          } catch (e) {}
        }

        // 3. Fallback to Local AI Dialogue Engine
        if (!j) {
          await new Promise((r) => setTimeout(r, 350));
          if (C.msgs.length === 0) {
            const greetings = {
              free: `Hello ${S.name || "there"}! Great to see you. How is your day going?`,
              class: `Hey ${S.name || "friend"}! Did you finish working on the assignment?`,
              prof: `Good day ${S.name || "student"}. What topic are you working on today?`,
              hr: `Hello ${S.name || "candidate"}, welcome to your interview. Could you please introduce yourself?`,
              shop: `Hello! Welcome to our cafe. How may I help you today?`,
              chal: `Welcome to today's challenge! Please share your thoughts on the topic.`
            };
            j = {
              reply: greetings[C.k] || `Hello ${S.name || "friend"}! What would you like to talk about today?`,
              correction: null,
              hint_hi: "Bolna shuru karein!",
            };
          } else {
            j = generateLocalAiTurn(userText, C.k);
          }
        }

        C.busy = false;
        const log = $("#log");
        if (log && j) {
          if (j.correction && j.correction.wrong) {
            addMist(
              j.correction.wrong,
              j.correction.right,
              j.correction.tip_hi,
            );
            log.insertAdjacentHTML(
              "beforeend",
              `<div class="fix">Good try! 👍 Small correction:<br>❌ ${esc(j.correction.wrong)}<br>✅ <b>${esc(j.correction.right)}</b><br><span class="mu">${esc(j.correction.tip_hi || "")}</span> <button class="s" style="padding:4px 10px" onclick="speak('${esc(j.correction.right).replace(/'/g, "\\'")}')">🔊</button></div>`,
            );
          }
          C.msgs.push({ r: "ai", t: j.reply });
          log.insertAdjacentHTML(
            "beforeend",
            `<div class="bub ai">${esc(j.reply)}<div class="row" style="margin-top:6px"><button class="s" style="padding:4px 10px" onclick="speak(this.dataset.t)" data-t="${esc(j.reply)}">🔊 Replay</button><button class="s" style="padding:4px 10px" onclick="speak(this.dataset.t,.6)" data-t="${esc(j.reply)}">🐢 Slow</button></div></div>`,
          );
          if ($("#fb")) {
            $("#fb").innerHTML = j.hint_hi
              ? `<p class="fix">💡 ${esc(j.hint_hi)}</p>`
              : "";
          }
          if ($("#st")) $("#st").textContent = "Tap & Speak";
          speak(j.reply);
          window.scrollTo(0, document.body.scrollHeight);
        }
      }
