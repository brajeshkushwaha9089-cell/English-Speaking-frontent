      function initSpeakingRecognition() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          const statEl = $("#speaking-rec-status");
          if (statEl) statEl.innerHTML = "<span style='color:#f59e0b'>Speech Recognition is supported best in Google Chrome or Edge.</span>";
          return;
        }

        try {
          if (speakingState.recog) {
            try { speakingState.recog.abort(); } catch (e) {}
            speakingState.recog = null;
          }

          const r = new SR();
          r.lang = speakingState.lang || "en-IN";
          r.continuous = true;
          r.interimResults = true;
          r.maxAlternatives = 1;

          r.onstart = () => {
            speakingState.micActive = true;
            speakingState.restartAttempts = 0;
            const ind = $("#transcript-mic-indicator");
            if (ind) ind.style.background = "#10b981";
            const stat = $("#speaking-rec-status");
            if (stat) stat.innerHTML = "🟢 Microphone listening continuously...";
          };

          r.onresult = (evt) => {
            let interim = "";
            for (let i = evt.resultIndex; i < evt.results.length; i++) {
              const trans = evt.results[i][0].transcript;
              if (evt.results[i].isFinal) {
                speakingState.finalTranscript = (speakingState.finalTranscript + " " + trans).trim();
              } else {
                interim += trans;
              }
            }
            speakingState.interimTranscript = interim;
            const combined = (speakingState.finalTranscript + " " + interim).trim();
            speakingState.speechText = combined;
            const words = combined.split(/\s+/).filter(Boolean);
            speakingState.wordsUsed = words.length;

            const liveBox = $("#speaking-live-transcript");
            if (liveBox) {
              liveBox.textContent = combined || "Listening to your voice... Speak clearly into your mic.";
              liveBox.style.fontStyle = combined ? "normal" : "italic";
            }
            const countEl = $("#speaking-word-count");
            if (countEl) countEl.textContent = words.length;
          };

          r.onerror = (evt) => {
            console.warn("Speech recognition error:", evt.error);
            if (evt.error === "no-speech") {
              // Pause in speaking — do NOT stop, continue listening
              return;
            }
            if (evt.error === "not-allowed" || evt.error === "service-not-allowed") {
              speakingState.isExplicitlyStopped = true;
              const stat = $("#speaking-rec-status");
              if (stat) stat.innerHTML = "<span style='color:#ef4444'>❌ Microphone blocked. Click the lock icon in address bar to Allow.</span>";
            }
          };

          r.onend = () => {
            speakingState.micActive = false;
            const ind = $("#transcript-mic-indicator");
            if (ind) ind.style.background = "#64748b";

            // If user did not explicitly stop recording, AUTOMATICALLY RESUME IMMEDIATELY
            if (!speakingState.isExplicitlyStopped && speakingState.stage === "speaking") {
              speakingState.restartAttempts = (speakingState.restartAttempts || 0) + 1;
              const delay = speakingState.restartAttempts > 3 ? 300 : 80;
              setTimeout(() => {
                if (!speakingState.isExplicitlyStopped && speakingState.stage === "speaking") {
                  try {
                    r.start();
                  } catch (e) {
                    initSpeakingRecognition();
                  }
                }
              }, delay);
            }
          };

          r.start();
          speakingState.recog = r;
        } catch (err) {
          console.warn("Speech recognition init exception:", err);
        }
      }

      async function startDirectSpeakingRecording() {
        if (!speakingState.activeExercise) speakingState.activeExercise = SPEAKING_EXERCISES[0];

        speakingState.stage = "speaking";
        speakingState.timer = 0; // Stopwatch: counts UP starting from 0, UNLIMITED!
        speakingState.startTime = Date.now();
        speakingState.speechText = "";
        speakingState.finalTranscript = "";
        speakingState.interimTranscript = "";
        speakingState.wordsUsed = 0;
        speakingState.isExplicitlyStopped = false;
        speakingState.restartAttempts = 0;

        // Re-render UI in speaking state
        R.speaking();

        // 1. Prime mic access via getUserMedia & start physical Web Audio Analyser
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            speakingState.audioStream = stream;

            try {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) {
                const ctx = new AudioCtx();
                const source = ctx.createMediaStreamSource(stream);
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 64;
                source.connect(analyser);
                speakingState.audioContext = ctx;
                speakingState.analyser = analyser;
                startAudioVisualizerLoop();
              }
            } catch (actxErr) {
              console.warn("AudioContext error:", actxErr);
            }
          }
        } catch (permErr) {
          console.warn("Microphone access prompt:", permErr);
          const statEl = $("#speaking-rec-status");
          if (statEl) statEl.innerHTML = "<span style='color:#ef4444'>⚠️ Microphone permission required. Please allow access in browser.</span>";
        }

        // 2. Start robust auto-reconnecting Speech Recognition
        initSpeakingRecognition();

        // 3. Unlimited Stopwatch Timer: counts UP, NEVER cuts off!
        if (speakingState.interval) clearInterval(speakingState.interval);
        speakingState.interval = setInterval(() => {
          speakingState.timer++;
          const numEl = $("#speaking-timer-num");
          if (numEl) numEl.textContent = formatSecs(speakingState.timer);
        }, 1000);
      }
      window.startDirectSpeakingRecording = startDirectSpeakingRecording;

      function finishSpeakingExercise() {
        speakingState.isExplicitlyStopped = true;
        if (speakingState.interval) clearInterval(speakingState.interval);
        if (speakingState.recog) {
          try { speakingState.recog.stop(); } catch (e) {}
        }
        stopAudioVisualizer();

        speakingState.stage = "review";
        const ex = speakingState.activeExercise || SPEAKING_EXERCISES[0];
        const totalWords = speakingState.wordsUsed || 0;
        const durationSecs = Math.max(1, speakingState.timer);
        const wpm = Math.round((totalWords / durationSecs) * 60);

        // Intelligent scoring calculation
        let score = 75;
        if (totalWords >= 60) score = 92;
        else if (totalWords >= 40) score = 86;
        else if (totalWords >= 25) score = 80;
        else if (totalWords >= 12) score = 74;
        else score = 65;

        let fluency = score;
        if (wpm >= 90 && wpm <= 150) fluency = Math.min(96, score + 4);
        else if (wpm < 50 && totalWords > 10) fluency = Math.max(68, score - 5);

        let pronunciation = Math.min(95, Math.max(70, score + (totalWords > 30 ? 2 : -2)));
        let vocab = Math.min(94, Math.max(70, score + 1));
        let grammar = Math.min(95, Math.max(70, score));

        speakingState.lastScore = score;
        speakingState.lastFluency = fluency;
        speakingState.lastPronunciation = pronunciation;
        speakingState.lastVocab = vocab;
        speakingState.lastGrammar = grammar;
        speakingState.lastDuration = durationSecs;
        speakingState.lastWpm = wpm;

        // Update progress & XP
        S.secs = (S.secs || 0) + durationSecs;
        S.sent = (S.sent || 0) + Math.max(1, Math.round(totalWords / 10));
        addXP(50 + Math.min(50, Math.floor(durationSecs / 10) * 5), ex.title);

        R.speaking();
      }

      function cancelSpeakingExercise() {
        speakingState.isExplicitlyStopped = true;

      function sendScenarioMessage() {
        const inp = $("#scenario-input");
        if (!inp || !inp.value.trim()) return;
        const text = inp.value.trim();
        inp.value = "";

        const sc = scenarioState.active;
        scenarioState.msgs.push({ r: "user", t: text });
        renderScenarioChatUI();

        // Show thinking indicator
        const flow = document.querySelector(".chat-flow");
        if (flow) {
          const thinkingEl = document.createElement("div");
          thinkingEl.id = "scenario-thinking-indicator";
          thinkingEl.style.cssText = "display:flex;justify-content:flex-start;margin:6px 0;";
          thinkingEl.innerHTML = `<div style="padding:8px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;font-size:13px;color:var(--mu)"><i>${sc.role} is typing...</i></div>`;
          flow.appendChild(thinkingEl);
          flow.scrollTop = flow.scrollHeight;
        }

        // Build rich dialogue history
        const historyText = scenarioState.msgs.slice(-6).map(m => (m.r === 'user' ? 'Customer/User: ' : `${sc.role}: `) + m.t).join("\n");
        const prompt = `You are roleplaying as "${sc.role}" in the scenario: "${sc.title}".
Scenario Context: ${sc.prompt}
Roleplay History:
${historyText}

The user just said: "${text}".

Instructions:
1. Respond directly in character as ${sc.role}.
2. Specifically acknowledge what the user said (e.g. if they say they are going to college, acknowledge college; if they order, ask about size/milk).
3. Be conversational, friendly, and realistic (1-2 sentences). Always advance the interaction with a natural follow-up question.
4. If there was a notable grammar or vocabulary slip, include a short, gentle tip.

Return ONLY a JSON object:
{
  "reply": "Your in-character spoken dialogue response here",
  "tip": "Short friendly tip or correction if helpful, otherwise null"
}`;

        callGeminiApi(prompt).then(res => {
          const thinking = document.getElementById("scenario-thinking-indicator");
          if (thinking) thinking.remove();

          let aiText = "";
          let tipText = null;

          if (res && (res.reply || res.text)) {
            aiText = res.reply || res.text;
            tipText = res.tip || null;
          } else {
            // High-efficiency local context-aware engine
            const fallback = getSmartLocalScenarioReply(sc, text, scenarioState.msgs);
            aiText = fallback.reply;
            tipText = fallback.tip;
          }

          scenarioState.msgs.push({ r: "ai", t: aiText, tip: tipText });
          addXP(15, "Scenario reply");
          renderScenarioChatUI();
          speak(aiText);
        }).catch(err => {
          const thinking = document.getElementById("scenario-thinking-indicator");
          if (thinking) thinking.remove();

          // Context-aware fallback guaranteed
          const fallback = getSmartLocalScenarioReply(sc, text, scenarioState.msgs);
          scenarioState.msgs.push({ r: "ai", t: fallback.reply, tip: fallback.tip });
          addXP(15, "Scenario reply");
          renderScenarioChatUI();
          speak(fallback.reply);
        });
      }

      function listenScenarioVoice() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { alert("Speech Recognition is supported in Chrome/Edge."); return; }
        const r = new SR();
        r.lang = "en-US";
        r.onresult = (e) => {
          const t = e.results[0][0].transcript;
          const inp = $("#scenario-input");
          if (inp) {
            inp.value = t;
            sendScenarioMessage();
          }
        };
        r.start();
      }

      setTimeout(() => { const b = $('#scenario-chat-box'); if (b) b.scrollTop = b.scrollHeight; }, 60);
      window.openScenario = openScenario;
      window.sendScenarioMessage = sendScenarioMessage;
      window.listenScenarioVoice = listenScenarioVoice;

        { word: "Oblivious", hindi: "अनजान / बेखबर", pos: "adjective", pronunciation: "/əˈblɪviəs/", definition: "Not aware of or not concerned about what is happening around one.", example: "He was oblivious to the clock while debugging the distributed transaction.", synonyms: ["unaware", "unmindful", "heedless"], antonyms: ["conscious", "aware", "mindful"], category: "daily" },

      async function sendGrammarChatMessage() {
        const inp = $('#grammar-chat-input');
        const q = inp ? inp.value.trim() : grammarState.chatInput.trim();
        if (!q || grammarState.isChatLoading) return;

        grammarState.chatMessages.push({ role: "user", text: q, time: "Just now" });
        grammarState.chatInput = "";
        grammarState.isChatLoading = true;
        R.grammar('coach');

        try {
          const res = await callAIGrammarCoach("chat", { query: q });
          const replyText = res.reply || res.text || res.explanation || "Here is your grammar coaching guide.";
          grammarState.chatMessages.push({
            role: "ai",
            text: replyText,
            formula: res.formula || null,
            examples: res.examples || [],
            mistake: res.mistake || null,
            speaking_prompt: res.speaking_prompt || null,
            time: "Just now"
          });
          addXP(15, "Grammar AI Inquiry");
        } catch (e) {
          grammarState.chatMessages.push({
            role: "ai",
            text: "English grammar is best internalized by repeating complete sentences aloud!",
            time: "Just now"
          });
        } finally {
          grammarState.isChatLoading = false;
          R.grammar('coach');
        }
      }

                    </div>

                    <div style="font-size:14.5px;color:#fcd34d;font-weight:600;margin-bottom:10px">${esc(ex.hindi)}</div>

                    <!-- Expandable Explanation -->
                    <div style="border-top:1px solid rgba(255,255,255,0.06);padding-top:10px;margin-top:6px">
                      <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleGrammarExampleExpand(${idx})">
                        <span style="font-size:13px;color:var(--pr-light);font-weight:700">
                          ${isExpanded ? '▼ Hide Detailed Breakdown' : '▶ Show Grammar Breakdown & Why Used'}
                        </span>
                        <span class="mu" style="font-size:12px">${isExpanded ? 'Close' : 'Expand'}</span>
                      </div>

                      ${isExpanded ? `
                        <div style="margin-top:10px;padding:12px 14px;background:rgba(0,0,0,0.25);border-radius:12px;line-height:1.6;font-size:13.5px">
                          <div style="margin-bottom:6px"><b>💡 Grammar Explanation:</b> ${esc(ex.explanation)}</div>
                          <div style="margin-bottom:6px"><b>🔑 Important Word:</b> <span class="badge" style="background:rgba(99,102,241,0.25);color:#fff">${esc(ex.important_word || "Key Verb")}</span></div>
                          <div><b>❓ Why this structure is used:</b> ${esc(ex.why_used || "Expresses natural state")}</div>
                        </div>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      function toggleGrammarExampleExpand(idx) {
        grammarState.expandedExampleIdx = (grammarState.expandedExampleIdx === idx ? null : idx);
        R.grammar('examples');
      }
      window.toggleGrammarExampleExpand = toggleGrammarExampleExpand;

      function setGrammarExampleCategory(cat) {
        grammarState.exampleCategory = cat;
        grammarState.expandedExampleIdx = 0;
        R.grammar('examples');
      }
      window.setGrammarExampleCategory = setGrammarExampleCategory;

      // ==========================================
      // 4. ✍️ PRACTICE MODULE
      // ==========================================
      function renderGrammarPracticeTab() {
        const detail = getTopicDetail(grammarState.currentTopicId);
        const questions = detail.practice_questions;
        const currentQ = questions[grammarState.practiceIdx % questions.length];

        return `
          <div class="card" style="text-align:left;padding:22px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
              <div style="display:flex;align-items:center;gap:8px">
                <span class="badge" style="background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff">Practice Exercise ${grammarState.practiceIdx + 1} of ${questions.length}</span>
                <span class="badge" style="background:rgba(255,255,255,0.06)">${esc(currentQ.type.toUpperCase().replace('_', ' '))}</span>
              </div>
              <span style="color:var(--ok);font-size:13px;font-weight:700">⭐ +5 XP per correct</span>
            </div>

            <h3 style="font-size:19px;color:#fff;margin:8px 0 14px">${esc(currentQ.question)}</h3>

            <!-- Options / Input Area -->
            ${currentQ.type === 'rearrange' ? `
              <div class="sentence-drop-area" style="margin-bottom:14px">
                <div style="display:flex;flex-wrap:wrap;gap:8px">
                  ${currentQ.scrambled.map(w => `
                    <button class="category-pill" style="font-size:14px" onclick="speak('${esc(w)}')">${esc(w)}</button>
                  `).join("")}
                </div>
              </div>
              <div style="margin-bottom:14px">
                <input id="practice-user-answer" type="text" placeholder="Type the rearranged sentence in order..." value="${esc(grammarState.practiceSelectedOpt || '')}" style="width:100%;font-size:15px">
              </div>
            ` : `
              <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
                ${currentQ.options.map((opt, i) => {
                  const isSelected = (grammarState.practiceSelectedOpt === opt);
                  let optStyle = "background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:12px 16px;border-radius:12px;font-size:14.5px;cursor:pointer;text-align:left;transition:all 0.15s ease";
                  if (isSelected) {
                    optStyle = "background:rgba(99,102,241,0.25);border:1px solid #818cf8;color:#fff;padding:12px 16px;border-radius:12px;font-size:14.5px;cursor:pointer;text-align:left";
                  }
                  return `
                    <button style="${optStyle}" onclick="selectPracticeOption('${esc(opt).replace(/'/g, "\\'")}')">
                      <b>${String.fromCharCode(65 + i)}.</b> ${esc(opt)}
                    </button>
                  `;
                }).join("")}
              </div>
            `}

            <!-- Result Feedback Card -->
            ${grammarState.practiceChecked ? `
              <div style="padding:14px 18px;border-radius:14px;margin-bottom:16px;background:${grammarState.practiceIsCorrect ? 'var(--ok-bg)' : 'var(--bad-bg)'};border:1px solid ${grammarState.practiceIsCorrect ? 'var(--ok-border)' : 'var(--bad-border)'};color:${grammarState.practiceIsCorrect ? 'var(--ok-text)' : 'var(--bad-text)'}">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                  <b style="font-size:16px">${grammarState.practiceIsCorrect ? '✅ Correct! Well done.' : '❌ Incorrect.'}</b>
                  <button class="s" style="padding:2px 8px;font-size:11px" onclick="speak('${esc(currentQ.answer).replace(/'/g, "\\'")}')">🔊 Listen Answer</button>
                </div>
                <div style="font-size:14px;line-height:1.6">
                  <div><b>Correct Answer:</b> "${esc(currentQ.answer)}"</div>
                  <div style="margin-top:4px"><b>Grammar Rule:</b> ${esc(currentQ.rule)}</div>
                  <div style="margin-top:4px;color:#fcd34d"><b>Hindi Explanation:</b> ${esc(currentQ.hindi_explanation)}</div>
                </div>
              </div>
            ` : ''}

            <!-- Action Buttons -->
            <div style="display:flex;gap:10px;justify-content:flex-end">
              <button class="g" onclick="resetPracticeQuestions()">Reset</button>
              ${!grammarState.practiceChecked ? `
                <button style="padding:10px 22px" onclick="submitPracticeAnswer()">Check Answer</button>
              ` : `
                <button style="padding:10px 22px" onclick="nextPracticeQuestion()">Next Question →</button>
              `}
            </div>
          </div>
        `;
      }

      function selectPracticeOption(opt) {
        grammarState.practiceSelectedOpt = opt;
        grammarState.practiceChecked = false;
        R.grammar('practice');
      }
      window.selectPracticeOption = selectPracticeOption;

      function submitPracticeAnswer() {
        const detail = getTopicDetail(grammarState.currentTopicId);
        const questions = detail.practice_questions;
        const currentQ = questions[grammarState.practiceIdx % questions.length];

        let userAns = grammarState.practiceSelectedOpt || "";
        if (currentQ.type === 'rearrange') {
          const inp = $('#practice-user-answer');
          if (inp) userAns = inp.value.trim();
        }

        if (!userAns) return;

        const isCorrect = (userAns.toLowerCase().replace(/[.,!]/g, "").trim() === currentQ.answer.toLowerCase().replace(/[.,!]/g, "").trim());
        grammarState.practiceChecked = true;
        grammarState.practiceIsCorrect = isCorrect;

        if (isCorrect) {
          grammarState.practiceScore++;
          addXP(5, "Practice Exercise");
          speak(currentQ.answer);
        }
        R.grammar('practice');
      }
      window.submitPracticeAnswer = submitPracticeAnswer;

      function nextPracticeQuestion() {
        grammarState.practiceIdx++;
        grammarState.practiceSelectedOpt = null;
        grammarState.practiceChecked = false;
        grammarState.practiceIsCorrect = false;
        R.grammar('practice');
      }
      window.nextPracticeQuestion = nextPracticeQuestion;

      function resetPracticeQuestions() {
        grammarState.practiceIdx = 0;
        grammarState.practiceSelectedOpt = null;
        grammarState.practiceChecked = false;
        grammarState.practiceIsCorrect = false;
        grammarState.practiceScore = 0;
        R.grammar('practice');
      }
      window.resetPracticeQuestions = resetPracticeQuestions;

      // ==========================================
      // 5. 🏆 CHALLENGE MODULE (60-SECOND SPEED BLITZ)
      // ==========================================
      function renderGrammarChallengeTab() {
        const detail = getTopicDetail(grammarState.currentTopicId);
        const questions = detail.challenge_questions || [];

        if (!grammarState.challengeActive && !grammarState.challengeComplete) {
          return `
            <div class="card" style="text-align:left;padding:26px">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
                <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:24px">🏆</div>
                <div>
                  <h2 style="margin:0;font-size:20px;color:#fff">4. Grammar Challenge: ${esc(detail.topic.title)}</h2>
                  <span class="mu" style="font-size:13px">Test your speed, grammar accuracy, and recall under time pressure!</span>
                </div>
              </div>

              <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:14px;margin:20px 0">
                <div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.3);border-radius:16px;padding:18px">
                  <div style="font-size:28px;margin-bottom:4px">🔥</div>
                  <h3 style="margin:0 0 4px;font-size:16px;color:#fbbf24">60-Second Speed Blitz</h3>
                  <p class="mu" style="font-size:13px;line-height:1.5;margin:0 0 14px">Rapid-fire questions to build instinctive grammar reflexes without hesitating.</p>
                  <button style="width:100%;padding:10px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff" onclick="startGrammarChallenge('blitz')">Start 60s Blitz 🔥</button>
                </div>

                <div style="background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.3);border-radius:16px;padding:18px">
                  <div style="font-size:28px;margin-bottom:4px">🎯</div>
                  <h3 style="margin:0 0 4px;font-size:16px;color:#c7d2fe">10-Question Mastery</h3>
                  <p class="mu" style="font-size:13px;line-height:1.5;margin:0 0 14px">Deep assessment across negative, question, and auxiliary forms.</p>
                  <button style="width:100%;padding:10px" onclick="startGrammarChallenge('mastery')">Start 10-Question Challenge 🎯</button>
                </div>
              </div>
            </div>
          `;
        }

        if (grammarState.challengeComplete) {
          const total = grammarState.challengeTotal || 10;
          const score = grammarState.challengeScore || 0;
          const pct = Math.round((score / total) * 100);

          return `
            <div class="card" style="text-align:center;padding:32px 20px">
              <div style="font-size:50px;margin-bottom:10px">${pct >= 70 ? '🎉' : '💪'}</div>
              <h2 style="font-size:24px;color:#fff;margin:0 0 6px">${pct >= 70 ? 'Challenge Conquered!' : 'Challenge Completed!'}</h2>
              <p class="mu" style="font-size:14px;margin:0 0 20px">You answered <b>${score}</b> out of <b>${total}</b> questions correctly (${pct}% accuracy)!</p>

              <div style="display:inline-flex;gap:20px;padding:14px 24px;background:rgba(255,255,255,0.04);border-radius:16px;margin-bottom:24px">
                <div>
                  <div style="font-size:22px;font-weight:800;color:#6ee7b7">${score}/${total}</div>
                  <div class="mu" style="font-size:12px">Correct</div>
                </div>
                <div>
                  <div style="font-size:22px;font-weight:800;color:#fbbf24">${pct}%</div>
                  <div class="mu" style="font-size:12px">Accuracy</div>
                </div>
                <div>
                  <div style="font-size:22px;font-weight:800;color:var(--pr-light)">+20 XP</div>
                  <div class="mu" style="font-size:12px">Awarded</div>
                </div>
              </div>

              <div>
                <button style="padding:10px 24px" onclick="startGrammarChallenge('blitz')">Try Again 🔥</button>
                <button class="g" style="padding:10px 20px;margin-left:8px" onclick="cancelGrammarChallenge()">Back to Overview</button>
              </div>
            </div>
          `;
        }

        // Active Challenge In-Progress
        const qIdx = grammarState.challengeQuestionIdx % questions.length;
        const q = questions[qIdx] || questions[0];

        return `
          <div class="card" style="text-align:left;padding:22px">
            <!-- Timer & Streak Header -->
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
              <div style="display:flex;align-items:center;gap:10px">
                <span class="badge" style="background:rgba(239,68,68,0.2);color:#f87171;font-size:14px;font-weight:800">
                  ⏱️ ${grammarState.challengeTimeLeft}s
                </span>
                <span class="badge" style="background:rgba(245,158,11,0.2);color:#fbbf24;font-size:13px">
                  🔥 ${grammarState.challengeStreak} Streak
                </span>
              </div>
              <span class="mu" style="font-size:13px">Question ${grammarState.challengeQuestionIdx + 1} of ${grammarState.challengeTotal}</span>
            </div>

            <h3 style="font-size:20px;color:#fff;margin:10px 0 16px">${esc(q.q)}</h3>

            <!-- Options Grid -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
              ${q.opts.map(opt => `
                <button style="padding:14px;font-size:15px;background:var(--card);border:1px solid var(--bd);text-align:center" onclick="submitChallengeAnswer('${esc(opt).replace(/'/g, "\\'")}')">
                  ${esc(opt)}
                </button>
              `).join("")}
            </div>

            <div style="display:flex;justify-content:flex-end">
              <button class="g" onclick="cancelGrammarChallenge()">Exit Challenge</button>
            </div>
          </div>
        `;
      }

      function startGrammarChallenge(mode) {
        grammarState.challengeMode = mode;
        grammarState.challengeActive = true;
        grammarState.challengeComplete = false;
        grammarState.challengeTimeLeft = (mode === 'blitz' ? 60 : 90);
        grammarState.challengeQuestionIdx = 0;
        grammarState.challengeScore = 0;
        grammarState.challengeTotal = 10;
        grammarState.challengeStreak = 0;

        if (grammarState.challengeTimerId) clearInterval(grammarState.challengeTimerId);
        grammarState.challengeTimerId = setInterval(() => {
          grammarState.challengeTimeLeft--;
          if (grammarState.challengeTimeLeft <= 0) {
            clearInterval(grammarState.challengeTimerId);
            grammarState.challengeActive = false;
            grammarState.challengeComplete = true;
            addXP(20, "Grammar Speed Challenge");
          }
          R.grammar('challenge');
        }, 1000);

        R.grammar('challenge');
      }
      window.startGrammarChallenge = startGrammarChallenge;

      function submitChallengeAnswer(opt) {
        const detail = getTopicDetail(grammarState.currentTopicId);
        const questions = detail.challenge_questions || [];
        const qIdx = grammarState.challengeQuestionIdx % questions.length;
        const q = questions[qIdx];

        if (opt === q.a) {
          grammarState.challengeScore++;
          grammarState.challengeStreak++;
        } else {
          grammarState.challengeStreak = 0;
        }

        grammarState.challengeQuestionIdx++;
        if (grammarState.challengeQuestionIdx >= grammarState.challengeTotal) {
          clearInterval(grammarState.challengeTimerId);
          grammarState.challengeActive = false;
          grammarState.challengeComplete = true;
          addXP(20, "Grammar Speed Challenge");
        }
        R.grammar('challenge');
      }
      window.submitChallengeAnswer = submitChallengeAnswer;

      function cancelGrammarChallenge() {
        if (grammarState.challengeTimerId) clearInterval(grammarState.challengeTimerId);
        grammarState.challengeActive = false;
        grammarState.challengeComplete = false;
        R.grammar('challenge');
      }
      window.cancelGrammarChallenge = cancelGrammarChallenge;


      // ==========================================
      // 6. 📖 MEANING (A-Z ENGLISH-HINDI DICTIONARY) MODULE
      // ==========================================
      function renderGrammarMeaningTab() {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const categories = ["All", "essential", "academic", "business", "daily"];

        let list = MEANING_DICTIONARY;
        if (grammarState.meaningSearch.trim()) {
          const q = grammarState.meaningSearch.toLowerCase().trim();
          list = list.filter(w =>
            w.word.toLowerCase().includes(q) ||
            w.hindi.toLowerCase().includes(q) ||
            w.definition.toLowerCase().includes(q)
          );
        } else {
          list = list.filter(w => w.word.toUpperCase().startsWith(grammarState.meaningLetter));
        }

        if (grammarState.meaningCategory !== "All") {
          list = list.filter(w => w.category === grammarState.meaningCategory);
        }

        return `
          <div style="text-align:left">
            <!-- Search & Filter Card -->
            <div class="card" style="padding:18px;margin-bottom:16px">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
                <div style="display:flex;align-items:center;gap:10px">
                  <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#06b6d4,#0284c7);display:flex;align-items:center;justify-content:center;font-size:20px">📖</div>
                  <div>
                    <h3 style="margin:0;font-size:17px">A–Z English-to-Hindi Dictionary</h3>
                    <span class="mu" style="font-size:12.5px">Master authentic Hindi meanings, phonetics, parts of speech, and real usage.</span>
                  </div>
                </div>
                <span class="badge" style="background:rgba(6,182,212,0.18);color:#67e8f9">${list.length} Words Found</span>
              </div>

              <!-- Search Bar -->
              <div style="display:flex;gap:8px;margin-bottom:12px">
                <input id="meaning-search-input" type="text" placeholder="Search any English word (e.g. Abundant, Resilient, Although, Serendipity)..." value="${esc(grammarState.meaningSearch)}" style="flex:1" oninput="handleMeaningSearch(this.value)">
                ${grammarState.meaningSearch ? '<button class="s" style="padding:8px 12px" onclick="clearMeaningSearch()">✕ Clear</button>' : ''}
              </div>

              <!-- Alphabet Selector Bar -->
              <div style="margin-bottom:10px">
                <span class="mu" style="font-size:12px;display:block;margin-bottom:4px">Browse Alphabetically (A to Z):</span>
                <div style="display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin">
                  ${letters.map(l => `
                    <button class="grammar-tab-btn ${grammarState.meaningLetter === l && !grammarState.meaningSearch ? 'active' : ''}" style="padding:5px 10px;font-size:12px;min-width:32px" onclick="setMeaningLetter('${l}')">${l}</button>
                  `).join("")}
                </div>
              </div>

              <!-- Category Filter Pills -->
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                ${categories.map(c => `
                  <button class="category-pill ${grammarState.meaningCategory === c ? 'active' : ''}" onclick="setMeaningCategory('${c}')">${c.toUpperCase()}</button>
                `).join("")}
              </div>
            </div>

            <!-- AI Lookup Fallback Banner (If no results or user wants AI lookup) -->
            ${list.length === 0 ? `
              <div class="card" style="text-align:center;padding:28px 16px;margin-bottom:16px">
                <div style="font-size:36px;margin-bottom:8px">🔍</div>
                <h3 style="margin:0 0 4px;font-size:18px">Word Not in Seed Dictionary</h3>
                <p class="mu" style="margin:0 0 16px;font-size:13.5px">Would you like your AI Grammar Coach to analyze <b>"${esc(grammarState.meaningSearch)}"</b>?</p>
                <button style="padding:10px 20px" onclick="lookupWordWithAI('${esc(grammarState.meaningSearch).replace(/'/g, "\\'")}')">
                  ✨ Instant AI Dictionary Lookup
                </button>
              </div>
            ` : ''}

            <!-- AI Live Result Card (If searched) -->
            ${grammarState.meaningAiResult ? `
              <div class="card" style="border-left:4px solid #38bdf8;margin-bottom:16px;padding:18px;text-align:left">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                  <span class="badge" style="background:rgba(56,189,248,0.2);color:#38bdf8">✨ AI Dictionary Result</span>
                  <button class="s" style="padding:2px 8px;font-size:11px" onclick="dismissMeaningAiResult()">✕ Dismiss</button>
                </div>
                <div style="display:flex;align-items:center;gap:10px">
                  <h2 style="margin:0;font-size:22px;color:#fff">${esc(grammarState.meaningAiResult.word || grammarState.meaningSearch)}</h2>
                  <button class="s" style="padding:2px 8px;font-size:11px" onclick="speak('${esc(grammarState.meaningAiResult.word || grammarState.meaningSearch).replace(/'/g, "\\'")}')">🔊</button>
                </div>
                <p style="font-size:14px;color:var(--tx-sec);margin:8px 0">${esc(grammarState.meaningAiResult.definition || grammarState.meaningAiResult.meaning || "")}</p>
                <div style="margin-top:8px">
                  <button class="s" style="padding:4px 12px;font-size:12px" onclick="toggleSaveMeaningWord('${esc(grammarState.meaningAiResult.word || grammarState.meaningSearch).replace(/'/g, "\\'")}')">⭐ Save to Revision</button>
                </div>
              </div>
            ` : ''}

            <!-- Word Cards Grid -->
            <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:14px">
              ${list.map(w => {
                const isSaved = grammarState.meaningSavedWords.includes(w.word);
                return `
                  <div class="card" style="text-align:left;padding:16px;display:flex;flex-direction:column;justify-content:space-between;position:relative">
                    <div>
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                        <span class="badge" style="background:rgba(99,102,241,0.18);color:var(--pr-light);font-size:11px">${esc(w.pos)}</span>
                        <span style="font-family:monospace;font-size:12px;color:#94a3b8">${esc(w.pronunciation)}</span>
                      </div>

                      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                        <h3 style="margin:0;font-size:19px;color:#fff">${esc(w.word)}</h3>
                        <button class="s" style="padding:3px 8px;font-size:11px" onclick="speak('${esc(w.word).replace(/'/g, "\\'")}')">🔊</button>
                      </div>

                      <div style="font-size:15px;font-weight:700;color:#fcd34d;margin-bottom:8px">
                        ${esc(w.hindi)}
                      </div>

                      <p style="font-size:13px;line-height:1.5;color:var(--tx-sec);margin:0 0 10px">
                        ${esc(w.definition)}
                      </p>

                      <div style="padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:10px;font-size:12.5px;line-height:1.4;margin-bottom:10px">
                        <b style="color:var(--pr-light)">Ex:</b> "${esc(w.example)}"
                      </div>
                    </div>

                    <!-- Synonyms / Antonyms & Save -->
                    <div style="border-top:1px solid rgba(255,255,255,0.06);padding-top:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
                      <div style="font-size:11.5px;color:var(--tx-sec)">
                        <b>Syn:</b> ${esc(w.synonyms.slice(0, 2).join(", "))}
                      </div>
                      <button class="s" style="padding:3px 8px;font-size:11px;color:${isSaved ? '#fbbf24' : 'var(--tx-sec)'}" onclick="toggleSaveMeaningWord('${esc(w.word).replace(/'/g, "\\'")}')">
                        ${isSaved ? '⭐ Saved' : '+ Save Word'}
                      </button>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      function setMeaningLetter(l) {
        grammarState.meaningLetter = l;
        grammarState.meaningSearch = "";
        R.grammar('meaning');
      }

      function toggleTopicSpeakingRecording(targetText) {

        if (grammarState.speakingIsRecording) {
          grammarState.speakingIsRecording = false;
          if (btn) {
            btn.innerHTML = "🎤 Tap to Speak Now";
            btn.style.background = "linear-gradient(135deg,#10b981,#059669)";
          }
          return;
        }

        grammarState.speakingIsRecording = true;
        if (btn) {
          btn.innerHTML = "🔴 Listening... Speak now!";
          btn.style.background = "linear-gradient(135deg,#ef4444,#dc2626)";
        }

        listen((spoken) => {
          grammarState.speakingIsRecording = false;
          if (btn) {
            btn.innerHTML = "🎤 Tap to Speak Again";
            btn.style.background = "linear-gradient(135deg,#10b981,#059669)";
          }

          if (spoken && spoken.trim()) {
            grammarState.speakingTranscript = spoken;

            // Simple word-overlap accuracy calculation
            const targetWords = targetText.toLowerCase().replace(/[^a-z0-9 ]/g, "").split(/\s+/);
            const spokenWords = spoken.toLowerCase().replace(/[^a-z0-9 ]/g, "").split(/\s+/);
            let matches = 0;
            targetWords.forEach(w => {
              if (spokenWords.includes(w)) matches++;
            });
            const acc = Math.min(100, Math.round((matches / targetWords.length) * 100));
            grammarState.speakingAccuracy = acc;

            if (acc >= 75) {
              addXP(15, "Spoken Sentence Accuracy");
            }
          } else {
            grammarState.speakingTranscript = "No speech detected. Please speak closer to your microphone.";
            grammarState.speakingAccuracy = 0;
          }
          R.grammar('speaking');
        }, (state) => {
          if (state === "end" || state === "error" || state === "nosr") {
            grammarState.speakingIsRecording = false;
            if (btn) {
              btn.innerHTML = "🎤 Tap to Speak Now";
              btn.style.background = "linear-gradient(135deg,#10b981,#059669)";
            }
          }
        });

        saveState();

          </div>

      async function runSentenceCheck() {
        const inp = $('#grammar-checker-input');
        const text = inp ? inp.value.trim() : grammarState.checkerInput.trim();
        if (!text || grammarState.isChecking) return;

        grammarState.checkerInput = text;
        grammarState.isChecking = true;
        grammarState.checkerResult = null;
        R.grammar('checker');

        try {
          const res = await callAIGrammarCoach("check", { sentence: text });
          grammarState.checkerResult = res;
          addXP(20, "Sentence Grammar Checked");
        } catch (e) {
          grammarState.checkerResult = {
            status: "correct",
            original: text,
            corrected: text,
            rule: "General English",
            explanation: "Could not connect to online check, but your sentence structure appears readable!",
            better_alternatives: [text],
            speaking_drill: text
          };
        } finally {
          grammarState.isChecking = false;
          R.grammar('checker');
        }
      }

      function setCheckerSentence(s) {
        grammarState.checkerInput = s;
        const inp = $('#grammar-checker-input');
        if (inp) inp.value = s;
        runSentenceCheck();
      }

      function dictateCheckerSentence() {
        const inp = $('#grammar-checker-input');
        listen((spoken) => {
          if (spoken) {
            if (inp) inp.value = spoken;
            grammarState.checkerInput = spoken;
            runSentenceCheck();
          }
        }, (state) => {});

      function clearCheckerSentence() {
        grammarState.checkerInput = "";
        grammarState.checkerResult = null;
        const inp = $('#grammar-checker-input');
        if (inp) inp.value = "";
        R.grammar('checker');
      }

      window.setCheckerSentence = setCheckerSentence;
      window.dictateCheckerSentence = dictateCheckerSentence;
      window.clearCheckerSentence = clearCheckerSentence;

        return `
          <div class="card" style="text-align:left;padding:20px">
            <div style="display:flex;justify-content:space-between;align-items:center">

            <h3 style="margin:10px 0 4px;font-size:18px">Arrange Words in Grammatically Correct Order</h3>

            <div class="sentence-drop-area">
              ${sentenceBuilderState.selected.length === 0 ? '<span class="mu" style="font-size:14px">Tap words below to place here...</span>' : ''}
              ${sentenceBuilderState.selected.map((w, i) => `
                <span class="chip selected" onclick="removeSentenceWord(${i})">${esc(w)} ✕</span>
              `).join("")}
            </div>

            <div style="margin:12px 0;display:flex;flex-wrap:wrap">
              ${remainingChips.map(w => `
                <span class="chip" onclick="addSentenceWord('${esc(w).replace(/'/g, "\\'")}')">${esc(w)}</span>
              `).join("")}
            </div>

            ${sentenceBuilderState.checked ? `
              <div style="padding:12px 16px;border-radius:14px;margin:12px 0;background:${sentenceBuilderState.isCorrect ? 'var(--ok-bg)' : 'var(--bad-bg)'};border:1px solid ${sentenceBuilderState.isCorrect ? 'var(--ok-border)' : 'var(--bad-border)'};color:${sentenceBuilderState.isCorrect ? 'var(--ok-text)' : 'var(--bad-text)'}">
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <b>${sentenceBuilderState.isCorrect ? '✅ Excellent! Perfect Grammatical Order.' : '❌ Not quite right yet.'}</b>
                  ${sentenceBuilderState.isCorrect ? `<button class="s" style="padding:2px 8px;font-size:11px" onclick="speak('${esc(item.correct).replace(/'/g, "\\'")}')">🔊 Listen</button>` : ''}
                </div>
                <div style="font-size:13.5px;margin-top:6px"><b>Pattern:</b> ${esc(item.grammar_pattern || item.pattern)}</div>

            ` : ''}

            <div style="display:flex;gap:10px;margin-top:14px">

              ${!sentenceBuilderState.checked ? `
                <button style="flex:2" onclick="checkSentenceBuilder()">Check Sentence</button>
              ` : `
                <button style="flex:2" onclick="nextSentenceBuilder()">Next Puzzle →</button>
              `}
            </div>
          </div>
        `;
      }

      function addSentenceWord(w) {
        sentenceBuilderState.selected.push(w);
        sentenceBuilderState.checked = false;
        R.grammar('builder');
      }

      function removeSentenceWord(i) {
        sentenceBuilderState.selected.splice(i, 1);
        sentenceBuilderState.checked = false;
        R.grammar('builder');
      }

      function resetSentenceBuilder() {
        sentenceBuilderState.selected = [];
        sentenceBuilderState.checked = false;
        R.grammar('builder');
      }

      function checkSentenceBuilder() {
        const item = SENTENCE_BUILDER_ITEMS[sentenceBuilderState.idx % SENTENCE_BUILDER_ITEMS.length];
        const userStr = sentenceBuilderState.selected.join(" ").trim();
        sentenceBuilderState.checked = true;
        sentenceBuilderState.isCorrect = (userStr.toLowerCase() === item.correct.toLowerCase());
        if (sentenceBuilderState.isCorrect) {
          addXP(25, "Sentence Puzzle");
          speak(item.correct);
        }
        R.grammar('builder');
      }

      function nextSentenceBuilder() {
        sentenceBuilderState.idx++;
        sentenceBuilderState.selected = [];
        sentenceBuilderState.checked = false;
        R.grammar('builder');
      }

      window.addSentenceWord = addSentenceWord;
      window.removeSentenceWord = removeSentenceWord;
      window.resetSentenceBuilder = resetSentenceBuilder;
      window.checkSentenceBuilder = checkSentenceBuilder;
      window.nextSentenceBuilder = nextSentenceBuilder;

      function toggleGrammarDrillRecording(topicId) {
        const btn = $('#drill-mic-btn');

        btn.innerHTML = "🔴 Listening... Speak now!";
        btn.style.background = "linear-gradient(135deg,#ef4444,#dc2626)";

        listen((spoken) => {
          btn.innerHTML = "🎤 Tap to Speak Again";

            box.innerHTML = `<b>You said:</b> "${esc(spoken)}"`;

            btn.innerHTML = "🎤 Tap to Speak Now";
            btn.style.background = "linear-gradient(135deg,#10b981,#059669)";
          }
        });

      R.interview = (subView) => {
        try {
          if (subView) interviewState.view = subView;
          const v = interviewState.view;

          if (v === "profile") {
            renderInterviewProfileEditor();
          } else if (v === "setup") {
            renderInterviewSetup();
          } else if (v === "room") {
            renderInterviewRoom();
          } else if (v === "report") {
            renderInterviewReport();
          } else {
            renderInterviewDashboard();
          }
        } catch (err) {
          console.error("Error in R.interview:", err);
          interviewState.view = "dashboard";
          try {
            renderInterviewDashboard();
          } catch (e2) {
            console.error("Fatal dashboard error:", e2);
            A.innerHTML = `

            `;

      };

                  <input type="text" id="prof-ind" value="${esc(p.targetIndustry || 'Software & AI Products')}" style="width:100%">
                </div>
              </div>

              <div style="display:flex;gap:10px;margin-top:10px">
                <button type="button" class="g" style="flex:1" onclick="R.interview('dashboard')">Cancel</button>
                <button type="submit" style="flex:2;padding:12px;background:var(--ok);color:#fff">Save Profile & Sync ✓</button>
              </div>
            </form>
          </div>
        `;
      }

      function addProjectToProfile() {
        if (!S.interviewProfile) S.interviewProfile = JSON.parse(JSON.stringify(DEFAULT_INTERVIEW_PROFILE));
        if (!Array.isArray(S.interviewProfile.projects)) S.interviewProfile.projects = [];
        S.interviewProfile.projects.push({
          title: "New Web Project",
          tech: "React, Node.js",
          description: "Full-stack project description.",
          challenges: "Database indexing and performance."
        });
        renderInterviewProfileEditor();
      }

      function removeProjectFromProfile(idx) {
        if (S.interviewProfile && Array.isArray(S.interviewProfile.projects)) {
          S.interviewProfile.projects.splice(idx, 1);
          renderInterviewProfileEditor();
        }
      }

      function saveInterviewProfile(e) {
        e.preventDefault();
        const p = S.interviewProfile || {};
        p.name = $('#prof-name').value.trim();
        p.education = $('#prof-edu').value.trim();
        p.college = $('#prof-college').value.trim();
        p.degreeBranch = $('#prof-degree').value.trim();
        p.currentYear = $('#prof-year').value.trim();
        p.experienceLevel = $('#prof-exp-level').value.trim();

        p.skills = $('#prof-skills').value.split(',').map(s => s.trim()).filter(Boolean);
        p.programmingLanguages = $('#prof-langs').value.split(',').map(s => s.trim()).filter(Boolean);
        p.technologies = $('#prof-techs').value.split(',').map(s => s.trim()).filter(Boolean);

        // Projects
        const titles = document.querySelectorAll('.proj-title-input');
        const techs = document.querySelectorAll('.proj-tech-input');
        const descs = document.querySelectorAll('.proj-desc-input');
        const chals = document.querySelectorAll('.proj-chal-input');
        const projs = [];
        titles.forEach((el, i) => {
          projs.push({
            title: el.value.trim(),
            tech: techs[i] ? techs[i].value.trim() : '',
            description: descs[i] ? descs[i].value.trim() : '',
            challenges: chals[i] ? chals[i].value.trim() : ''
          });
        });
        p.projects = projs;

        p.achievements = $('#prof-achieve').value.split('\n').map(s => s.trim()).filter(Boolean);
        p.certifications = $('#prof-certs').value.split('\n').map(s => s.trim()).filter(Boolean);
        p.internshipExp = $('#prof-intern').value.trim();
        p.workExp = $('#prof-work').value.trim();

        p.careerGoals = $('#prof-goals').value.trim();
        p.preferredRole = $('#prof-role').value.trim();
        p.strengths = $('#prof-strengths').value.split(',').map(s => s.trim()).filter(Boolean);
        p.areasForImprovement = $('#prof-weak').value.split(',').map(s => s.trim()).filter(Boolean);
        p.targetIndustry = $('#prof-ind').value.trim();

        S.interviewProfile = p;
        saveState();
        showXPToast(20, "Profile Saved");
        R.interview('dashboard');

      function loadProfilePreset(presetKey) {
        if (presetKey === 'fullstack') {
          S.interviewProfile = JSON.parse(JSON.stringify(DEFAULT_INTERVIEW_PROFILE));
          S.interviewProfile.preferredRole = "Full-Stack Software Engineer";
        } else if (presetKey === 'frontend') {
          S.interviewProfile = JSON.parse(JSON.stringify(DEFAULT_INTERVIEW_PROFILE));
          S.interviewProfile.preferredRole = "Frontend Engineer (React / Next.js)";
          S.interviewProfile.skills = ["JavaScript (ES6+)", "React.js", "Next.js", "TypeScript", "Tailwind CSS", "Redux Toolkit", "Web Performance"];
        } else if (presetKey === 'fresher') {
          S.interviewProfile = JSON.parse(JSON.stringify(DEFAULT_INTERVIEW_PROFILE));
          S.interviewProfile.preferredRole = "Graduate Software Engineer";
          S.interviewProfile.experienceLevel = "Fresher (2025/2026 Batch)";
        } else {
          S.interviewProfile = JSON.parse(JSON.stringify(DEFAULT_INTERVIEW_PROFILE));
        }

        renderInterviewProfileEditor();
      }

      window.addProjectToProfile = addProjectToProfile;
      window.removeProjectFromProfile = removeProjectFromProfile;
      window.saveInterviewProfile = saveInterviewProfile;
      window.loadProfilePreset = loadProfilePreset;

      // -------------------------------------------------------------
      // 4. LIVE INTERVIEW SIMULATION ROOM
      // -------------------------------------------------------------
      async function startInterviewSession() {
        const profile = S.interviewProfile || DEFAULT_INTERVIEW_PROFILE;
        interviewState.activeSessionId = "iv_" + Date.now();
        interviewState.currentQuestionIdx = 1;
        interviewState.totalQuestions = 6;
        interviewState.qas = [];
        interviewState.lastEvaluation = null;
        interviewState.finalReport = null;
        interviewState.userAnswer = "";
        interviewState.isEvaluating = false;
        interviewState.view = "room";

        R.interview('room');

        // Fetch First Question from Backend or Fallback
        const ivStartUrl = getApiUrl("/api/interviews/start");
        if (ivStartUrl) {
          try {
            const res = await fetch(ivStartUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              profile: profile,
              type: interviewState.selectedType,
              difficulty: interviewState.selectedDifficulty,
              goal: interviewState.selectedGoal,
              mode: interviewState.selectedMode,
              key: S.geminiKey || ""
            })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.data) {
              interviewState.interviewerSpeech = data.data.greeting || "Welcome to your interview!";
              interviewState.currentQuestion = data.data.question;
              interviewState.currentHint = data.data.hint || "";
              interviewState.currentRound = data.data.round || "introduction";
              interviewState.currentRoundTitle = data.data.roundTitle || "Round 1: Self Introduction";
            }
          }
        } catch (e) {}
      }

        // Fallback question if offline
        if (!interviewState.currentQuestion) {
          const candDegree = profile.degreeBranch || profile.education || "Computer Science";
          interviewState.interviewerSpeech = `Hello ${profile.name || "Candidate"}! Welcome to your ${interviewState.selectedType.replace('_', ' ')} interview. Let us begin.`;
          interviewState.currentQuestion = `To start off, could you please walk me through your background in ${candDegree}, and summarize the key technical projects that define your skillset?`;
          interviewState.currentHint = "Structure: 1) Who you are, 2) Degree & College, 3) Key tech stacks, 4) Ambition for this role.";
          interviewState.currentRound = "introduction";
          interviewState.currentRoundTitle = "Round 1: Professional Self Introduction";
        }

        R.interview('room');
        startAnswerTimer();

        if (interviewState.voiceMode) {
          speakQuestion(`${interviewState.interviewerSpeech} ${interviewState.currentQuestion}`);
        }
      }

              <div style="flex:1">
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <h3 style="margin:0;font-size:16px">Sarah Jenkins</h3>
                  <button class="s" style="padding:2px 8px;font-size:11px" onclick="speakQuestion('${esc(interviewState.currentQuestion).replace(/'/g, "\\'")}')">🔊 Replay Audio</button>
                </div>
                <div class="mu" style="font-size:12px">Senior Engineering Manager • Corporate Hiring Lead</div>
              </div>
            </div>

            <div style="padding:16px;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.25);border-radius:16px;margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <span style="font-size:12px;font-weight:700;color:var(--pr-light)">${esc(interviewState.currentRoundTitle)}</span>
                <span class="mu" style="font-size:12px">Question ${interviewState.currentQuestionIdx} of ${interviewState.totalQuestions}</span>
              </div>
              <div style="font-size:17px;font-weight:600;line-height:1.5;color:var(--tx);margin:4px 0">
                "${esc(interviewState.currentQuestion)}"
              </div>
              ${interviewState.currentHint ? `
                <div style="margin-top:8px;font-size:12.5px;color:var(--mu);display:flex;align-items:center;gap:4px">
                  <span>💡 <b>Tip:</b> ${esc(interviewState.currentHint)}</span>
                </div>
              ` : ''}
            </div>

            <!-- Answer Box & Controls (Only when not viewing learning mode feedback) -->

              <div>

                <textarea id="interview-user-answer" rows="4" placeholder="Speak your answer or type here in English..." style="width:100%;font-size:15px;line-height:1.5;resize:vertical;margin-bottom:10px">${esc(interviewState.userAnswer)}</textarea>

                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                  <button id="interview-mic-btn" class="s" style="padding:10px 16px;border-radius:24px;font-weight:700" onclick="toggleInterviewVoiceRecording()">
                    ${interviewState.isListeningVoice ? '🔴 Listening... (Tap to finish)' : '🎤 Speak Answer (Live Voice)'}
                  </button>
                  <button style="padding:10px 22px;border-radius:24px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:700" onclick="submitInterviewAnswer()" ${interviewState.isEvaluating ? 'disabled' : ''}>
                    ${interviewState.isEvaluating ? 'Evaluating Answer...' : 'Submit Answer →'}
                  </button>

            <!-- Evaluation Card (Displayed in Learning Mode) -->
            ${evalData ? `

                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
                  <span class="badge" style="background:var(--ok-bg);color:var(--ok-text);font-weight:700">Answer Analysis & Coach Feedback</span>
                  <span class="mu" style="font-size:12px">Question ${interviewState.currentQuestionIdx} Completed</span>
                </div>

                <!-- Interviewer Reaction -->
                <div style="padding:12px 14px;background:rgba(255,255,255,0.03);border-radius:12px;margin-bottom:12px;font-size:14px;line-height:1.5">
                  <b>Interviewer Reaction:</b> "${esc(evalData.interviewer_reaction || 'Good response.')}"
                </div>

                <!-- Grammar Breakdown -->
                ${evalData.grammar_analysis ? `
                  <div class="card" style="padding:12px;margin-bottom:12px;border-left:4px solid ${evalData.grammar_analysis.has_errors ? 'var(--bad)' : 'var(--ok)'}">
                    <b style="font-size:13px">${evalData.grammar_analysis.has_errors ? '⚠️ Grammar & Structure Adjustments:' : '✅ Flawless Grammar & Structure!'}</b>
                    ${evalData.grammar_analysis.mistakes && evalData.grammar_analysis.mistakes.length ? `
                      <div style="margin-top:6px">
                        ${evalData.grammar_analysis.mistakes.map(m => `
                          <div style="font-size:13px;margin:4px 0">
                            <span style="color:#f87171">❌ "${esc(m.wrong)}"</span> ➔ <span style="color:#34d399">✅ "${esc(m.right)}"</span>
                            <div class="mu" style="font-size:12px">${esc(m.explanation)}</div>
                          </div>
                        `).join("")}
                      </div>
                    ` : '<div class="mu" style="font-size:12.5px;margin-top:2px">No grammatical issues detected. Clean sentence construction!</div>'}
                  </div>
                ` : ''}

                <!-- STAR Method Breakdown -->
                ${evalData.star_analysis && evalData.star_analysis.evaluated ? `
                  <div class="card" style="padding:12px;margin-bottom:12px">
                    <b style="font-size:13px;display:block;margin-bottom:6px">⭐ STAR Method Structure:</b>
                    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">
                      <span class="star-pill ${evalData.star_analysis.situation ? 'covered' : 'missing'}">[S] Situation ${evalData.star_analysis.situation ? '✓' : '⚠️'}</span>
                      <span class="star-pill ${evalData.star_analysis.task ? 'covered' : 'missing'}">[T] Task ${evalData.star_analysis.task ? '✓' : '⚠️'}</span>
                      <span class="star-pill ${evalData.star_analysis.action ? 'covered' : 'missing'}">[A] Action ${evalData.star_analysis.action ? '✓' : '⚠️'}</span>
                      <span class="star-pill ${evalData.star_analysis.result ? 'covered' : 'missing'}">[R] Result ${evalData.star_analysis.result ? '✓' : '⚠️'}</span>

                  <div style="padding:12px 14px;background:rgba(99,102,241,0.06);border:1px solid rgba(99,102,241,0.25);border-radius:12px;margin-bottom:14px">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                      <b style="font-size:13px;color:var(--pr-light)">One Possible Improved Version:</b>
                      <button class="s" style="padding:2px 8px;font-size:11px" onclick="speak('${esc(evalData.improved_version).replace(/'/g, "\\'")}')">🔊 Listen</button>
                    </div>
                    <div style="font-size:14px;line-height:1.5;color:var(--tx)">"${esc(evalData.improved_version)}"</div>
                  </div>
                ` : ''}

                <!-- Action Buttons -->
                <div style="display:flex;gap:10px;justify-content:flex-end">
                  <button class="g" onclick="retryCurrentQuestion()">🔄 Try Again</button>

      function formatInterviewTimer(secs) {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      }

      function startAnswerTimer() {
        clearInterval(interviewState.timerInterval);
        if (interviewState.timerDuration <= 0) return;

        interviewState.timerSecondsLeft = interviewState.timerDuration;
        interviewState.timerInterval = setInterval(() => {
          interviewState.timerSecondsLeft--;
          const disp = $('#interview-timer-display');
          if (disp) {
            disp.innerHTML = `⏳ ${formatInterviewTimer(interviewState.timerSecondsLeft)}`;
            if (interviewState.timerSecondsLeft <= 10) {
              disp.style.color = "var(--bad-text)";
            }
          }
          if (interviewState.timerSecondsLeft <= 0) {
            clearInterval(interviewState.timerInterval);
            // Auto submit if answer is present
            const ansBox = $('#interview-user-answer');
            if (ansBox && ansBox.value.trim().length > 5) {
              submitInterviewAnswer();
            }
          }
        }, 1000);
      }

      function speakQuestion(text) {
        interviewState.isSpeakingAudio = true;
        const avatar = document.querySelector('.interviewer-avatar');
        if (avatar) avatar.classList.add('speaking');

        speak(text, 1, () => {
          interviewState.isSpeakingAudio = false;
          if (avatar) avatar.classList.remove('speaking');
        });
      }

      function toggleInterviewVoiceRecording() {
        const btn = $('#interview-mic-btn');
        const box = $('#interview-user-answer');
        if (!btn || !box) return;

        if (interviewState.isListeningVoice) {
          stopListening();
          interviewState.isListeningVoice = false;
          btn.innerHTML = "🎤 Speak Answer (Live Voice)";
          btn.style.background = "";
          return;
        }

        interviewState.isListeningVoice = true;
        btn.innerHTML = "🔴 Listening... Speak clearly!";
        btn.style.background = "linear-gradient(135deg,#ef4444,#dc2626)";

        listen((spoken) => {
          interviewState.isListeningVoice = false;
          btn.innerHTML = "🎤 Speak Answer (Live Voice)";
          btn.style.background = "";
          if (spoken && spoken.trim()) {
            const cur = box.value.trim();
            box.value = cur ? `${cur} ${spoken}` : spoken;
            interviewState.userAnswer = box.value;
          }
        }, (state) => {
          if (state === "end" || state === "error" || state === "nosr") {
            interviewState.isListeningVoice = false;
            btn.innerHTML = "🎤 Speak Answer (Live Voice)";
            btn.style.background = "";
          }
        });
      }

      async function submitInterviewAnswer() {
        const box = $('#interview-user-answer');
        const ans = box ? box.value.trim() : interviewState.userAnswer.trim();
        if (!ans) {
          alert("Please provide an answer before proceeding.");
          return;
        }

        clearInterval(interviewState.timerInterval);
        interviewState.userAnswer = ans;
        interviewState.isEvaluating = true;
        renderInterviewRoom();

        const profile = S.interviewProfile || DEFAULT_INTERVIEW_PROFILE;
        let evalData = null;

        // Try Backend Evaluation Endpoint
        try {
          const res = await fetch(getApiUrl("/api/interviews/answer"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question: interviewState.currentQuestion,
              answer: ans,
              roundType: interviewState.currentRound,
              profile: profile,
              mode: interviewState.selectedMode,
              difficulty: interviewState.selectedDifficulty,
              questionIdx: interviewState.currentQuestionIdx,
              totalQuestions: interviewState.totalQuestions,
              key: S.geminiKey || ""
            })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.data) evalData = data.data;
          }
        } catch (e) {}

        // Direct Client-Side Gemini Fallback
        if (!evalData) {
          try {
            const prompt = `You are Sarah Jenkins, Senior Interviewer. Question: "${interviewState.currentQuestion}". Candidate Answer: "${ans}". Round: ${interviewState.currentRound}. Mode: ${interviewState.selectedMode}. Output strictly JSON: {"interviewer_reaction":"...","grammar_analysis":{"has_errors":false,"score":88,"mistakes":[]},"star_analysis":{"evaluated":true,"situation":true,"task":true,"action":true,"result":true,"feedback":"Good"},"improved_version":"...","is_final_question":${interviewState.currentQuestionIdx >= interviewState.totalQuestions},"next_round":"skills","next_round_title":"Round: Skills","next_question":"...","next_hint":"..."}`;
            const gemRes = await callGeminiApi(prompt);
            if (gemRes && (gemRes.interviewer_reaction || gemRes.improved_version)) {
              evalData = gemRes;
            }
          } catch (ge) {}
        }

        // Local Smart Fallback Engine
        if (!evalData) {
          evalData = {
            interviewer_reaction: "Thank you for detailing that out. That gives me a clear sense of your practical experience.",
            grammar_analysis: {
              has_errors: false,
              score: 88,
              mistakes: []
            },
            star_analysis: {
              evaluated: (interviewState.currentRound === 'projects' || interviewState.currentRound === 'behavioral'),
              situation: true,
              task: true,
              action: true,
              result: true,
              feedback: "Solid structure. Always quantify with concrete numbers or outcomes whenever possible."
            },
            improved_version: `In summary, ${ans}`,
            is_final_question: (interviewState.currentQuestionIdx >= interviewState.totalQuestions),
            next_round: "skills",
            next_round_title: "Round: Technical Deep Dive",
            next_question: `Could you walk me through your technical choices when building full-stack web applications?`,
            next_hint: "Be specific about architectural trade-offs."
          };
        }

        // Save into session QAs
        interviewState.qas.push({
          q: interviewState.currentQuestion,
          a: ans,
          round: interviewState.currentRound,
          eval: evalData
        });

        interviewState.lastEvaluation = evalData;
        interviewState.isEvaluating = false;

        // In Real Interview Mode: Skip detailed interstitial review to mimic real corporate interview!
        if (interviewState.selectedMode === 'real') {
          advanceToNextQuestion();
        } else {
          renderInterviewRoom();
        }
      }

      function retryCurrentQuestion() {
        interviewState.lastEvaluation = null;
        renderInterviewRoom();
        startAnswerTimer();
      }

      function advanceToNextQuestion() {
        const evalData = interviewState.lastEvaluation;
        if (!evalData || evalData.is_final_question || interviewState.currentQuestionIdx >= interviewState.totalQuestions) {
          finishInterviewSession();
          return;
        }

        interviewState.currentQuestionIdx++;
        interviewState.currentQuestion = evalData.next_question || "Can you explain your experience in software engineering?";
        interviewState.currentHint = evalData.next_hint || "";
        interviewState.currentRound = evalData.next_round || "skills";
        interviewState.currentRoundTitle = evalData.next_round_title || `Round ${interviewState.currentQuestionIdx}`;
        interviewState.interviewerSpeech = evalData.interviewer_reaction || "";
        interviewState.userAnswer = "";
        interviewState.lastEvaluation = null;

        renderInterviewRoom();
        startAnswerTimer();

        if (interviewState.voiceMode) {
          speakQuestion(`${interviewState.interviewerSpeech} ${interviewState.currentQuestion}`);
        }
      }

      function exitInterviewSession() {
        clearInterval(interviewState.timerInterval);
        if (confirm("Exit interview session? Current progress will be saved in your report.")) {
          if (interviewState.qas.length > 0) {
            finishInterviewSession();
          } else {
            R.interview('dashboard');
          }
        }
      }

      window.startInterviewSession = startInterviewSession;
      window.toggleInterviewVoiceRecording = toggleInterviewVoiceRecording;
      window.submitInterviewAnswer = submitInterviewAnswer;
      window.retryCurrentQuestion = retryCurrentQuestion;
      window.advanceToNextQuestion = advanceToNextQuestion;
      window.exitInterviewSession = exitInterviewSession;
      window.speakQuestion = speakQuestion;

      // -------------------------------------------------------------
      // 5. FINAL REPORT & PERSONALIZED PRACTICE ROADMAP
      // -------------------------------------------------------------
      async function finishInterviewSession() {
        clearInterval(interviewState.timerInterval);
        interviewState.view = "report";
        R.interview('report');

      function renderVocabCards() {
        const listDiv = $("#vocab-cards-list");
        if (!listDiv) return;

        const allList = [...VOC_BOOK, ...S.customWords];
        const filtered = allList.filter((item) => {
          if (vocabFilter === "saved" && !S.words.includes(item.w)) return false;
          if (vocabFilter === "custom" && !S.customWords.some(c => c.w === item.w)) return false;
          if (vocabFilter !== "all" && vocabFilter !== "saved" && vocabFilter !== "custom" && item.c !== vocabFilter) return false;
          if (vocabSearch) {
            const q = vocabSearch.toLowerCase();
            const inW = item.w.toLowerCase().includes(q);
            const inH = (item.h || "").toLowerCase().includes(q);
            const inP = (item.p || "").toLowerCase().includes(q);
            if (!inW && !inH && !inP) return false;
          }
          return true;
        });

        if (!filtered.length) {
          listDiv.innerHTML = `<div class="card" style="text-align:center"><p class="mu">No words found matching "${esc(vocabSearch)}".</p></div>`;
          return;
        }

        listDiv.innerHTML = filtered
          .map((v, i) => {
            const isLearned = S.words.includes(v.w);
            return `
              <div class="card" id="vc-${i}">
                <div style="display:flex;justify-content:space-between;align-items:flex-start">
                  <div>
                    <span class="big">${esc(v.w)}</span>
                    <span class="pron" style="margin-left:8px">(${esc(v.p || "")})</span>
                  </div>
                  <span class="badge">${esc(v.c || "general")}</span>
                </div>
                <p style="font-weight:600;color:var(--tx);margin:4px 0 8px">${esc(v.h)}</p>
                <div style="background:var(--pr2);padding:10px 12px;border-radius:12px;margin:6px 0">
                  <p style="margin:0 0 4px"><b>“${esc(v.e)}”</b></p>
                  <p class="mu" style="margin:0;font-size:13px">${esc(v.eh || "")}</p>
                </div>
                <div class="row" style="margin-top:10px">
                  <button class="s" style="padding:8px" onclick="speak('${esc(v.w).replace(/'/g, "\\'")}')">🔊 Word</button>
                  <button class="s" style="padding:8px" onclick="speak('${esc(v.e).replace(/'/g, "\\'")}')">🔊 Sentence</button>
                  <button class="s" style="padding:8px" onclick="practiceWord('${esc(v.w).replace(/'/g, "\\'")}', 'vc-${i}')">🎤 Speak</button>
                  <button class="s" style="padding:8px" onclick="askGeminiWordExample('${esc(v.w).replace(/'/g, "\\'")}', 'vc-${i}')">✨ AI Ex</button>
                  <button class="${isLearned ? 's' : ''}" style="padding:8px" onclick="learnW('${esc(v.w).replace(/'/g, "\\'")}')">${isLearned ? '✓ Learned' : 'Learn'}</button>
                </div>
                <div id="vc-${i}-feedback"></div>
              </div>
            `;
          })
          .join("");
      }

      function practiceWord(targetWord, cardId) {
        const fb = $(`#${cardId}-feedback`);
        if (fb) fb.innerHTML = `<p class="mu" style="margin-top:8px">🔴 AI is listening... Bolen: <b>"${esc(targetWord)}"</b></p>`;

        listen(
          (said) => {
            const sc = sim(said, targetWord);
            const ok = sc >= 0.75;
            if (fb) {
              fb.innerHTML = `
                <div class="fix" style="margin-top:8px">
                  <p class="mu">You said: <b>"${esc(said)}"</b></p>
                  ${ok ? '<p style="color:var(--ok)">✅ Perfect pronunciation! Well done!</p>' : `<p>Good try! Practice bolkar dekhein: <b>${esc(targetWord)}</b></p>`}
                </div>
              `;
            }
            if (ok && !S.words.includes(targetWord)) {
              S.words.push(targetWord);
              save();
            }
          },
          (st) => {
            if (st.startsWith("err") && fb) {
              fb.innerHTML = `<p class="mu" style="color:var(--bad);margin-top:8px">${stMsg(st)}</p>`;
            }
          }
        );
      }
