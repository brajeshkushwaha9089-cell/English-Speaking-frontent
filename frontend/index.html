        // 1. Direct match in curated alternate examples
        if (VOC_ALT_EXAMPLES[word]) return VOC_ALT_EXAMPLES[word];
        const lower = word.toLowerCase().trim();
        for (const [k, v] of Object.entries(VOC_ALT_EXAMPLES)) {
          if (k.toLowerCase() === lower) return v;
        }

        // 2. Direct match in VOC_BOOK primary examples
        const bookMatch = VOC_BOOK.find(x => x.w.toLowerCase() === lower);
        if (bookMatch && bookMatch.e) {
          return {
            en: bookMatch.e,
            hi: bookMatch.eh || `"${bookMatch.w}" का दैनिक बातचीत में प्रयोग।`
          };
        }

        // 3. Smart linguistic template for custom words
        return {
          en: `You can use "${word}" to express your thoughts naturally in conversation.`,
          hi: `बातचीत में अपने विचारों को स्वाभाविक रूप से व्यक्त करने के लिए आप "${word}" का उपयोग कर सकते हैं।`
        };
      }

      async function askGeminiWordExample(word, cardId) {
        const fb = $(`#${cardId}-feedback`);
        if (fb) fb.innerHTML = `<p class="mu" style="margin-top:6px">✨ Generating AI example for "<b>${esc(word)}</b>"...</p>`;
        const prompt = `You are an English coach. Create ONE simple, realistic daily-spoken English sentence using the word "${word}", and its Hindi translation. Output JSON only: {"en":"...","hi":"..."}`;

        let example = null;
        let isAiGenerated = false;

        try {
          const res = await callGeminiApi(prompt);
          if (res && (res.en || res.sentence || res.english || res.reply)) {
            const enText = res.en || res.sentence || res.english || res.reply;
            const hiText = res.hi || res.hindi || res.translation || "";
            if (enText && enText.trim()) {
              example = { en: enText.trim(), hi: hiText.trim() };
              isAiGenerated = true;
            }
          }
        } catch (e) {
          console.warn("AI example generation error:", e);
        }

        // Guaranteed high-yield contextual fallback if offline or network lag
        if (!example || !example.en) {
          example = getSmartWordExample(word);
          isAiGenerated = false;
        }

        if (fb && example && example.en) {

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <b>🤖 AI Provider & Models</b>
              <span class="badge" style="background:${S.aiMode === 'local' ? 'var(--bd)' : 'var(--ok)'};color:#fff">
                ${S.aiMode === 'openai' ? '⚡ ChatGPT Active' : (S.aiMode === 'gemini' ? '✨ Gemini Active' : '🏠 Local Mode')}
              </span>
            </div>
            <p class="mu" style="font-size:13px">Choose your preferred AI coach engine. If OpenAI has no credits or is busy, Bolo automatically falls back to Gemini so your practice never stops.</p>

            <div class="row" style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap">
              <button class="${S.aiMode === 'gemini' ? '' : 's'}" onclick="S.aiMode='gemini';save();R.set()">✨ Google Gemini (Active & Free)</button>
              <button class="${S.aiMode === 'openai' ? '' : 's'}" onclick="S.aiMode='openai';save();R.set()">⚡ OpenAI ChatGPT (gpt-4o-mini)</button>
              <button class="${S.aiMode === 'local' ? '' : 's'}" onclick="S.aiMode='local';save();R.set()">🏠 Local Mode</button>
            </div>

            <!-- Gemini Key Config -->
            <div style="margin:14px 0;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08)">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <label class="mu" style="font-size:12.5px;font-weight:600">Google Gemini API Key (Recommended)</label>
                <span class="badge" style="background:#065f46;color:#6ee7b7;font-size:10.5px">✓ 100% Free & Working</span>
              </div>
              <div style="display:flex;gap:6px;margin-top:6px">
                <input type="password" id="gemini-key-input" value="${esc(S.geminiKey || '')}" placeholder="Gemini API Key">

              </div>
              <button class="s" style="width:100%;margin-top:6px" onclick="testGeminiConnection()">⚡ Test Gemini Connection</button>
              <div id="gemini-test-res" style="margin-top:6px;font-size:13px"></div>
            </div>

            <!-- OpenAI ChatGPT Key Config -->
            <div style="margin:14px 0;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08)">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <label class="mu" style="font-size:12.5px;font-weight:600">OpenAI ChatGPT API Key</label>
                <span style="font-size:11px;color:#cbd5e1">Model: <code>gpt-4o-mini</code></span>
              </div>
              <div style="display:flex;gap:6px;margin-top:6px">
                <input type="password" id="openai-key-input" value="${esc(S.openaiKey || '')}" placeholder="sk-proj-...">
                <button class="s" style="padding:10px 14px;white-space:nowrap" onclick="toggleKeyVisibility('openai-key-input')">👁️</button>

              <button class="s" style="width:100%;margin-top:6px" onclick="testOpenAiConnection()">⚡ Test ChatGPT Connection</button>

          <div class="card">
            <p><b>Backend API Server (Render / Local)</b></p>
            <p class="mu" style="font-size:13px">Render ya Localhost backend URL yahan daalein (e.g. <code>https://bolo-english-backend.onrender.com</code> ya <code>http://localhost:8000</code>):</p>
            <div style="display:flex;gap:6px;margin-top:6px">
              <input type="text" id="backend-url-input" value="${esc(S.backendUrl || '')}" placeholder="http://localhost:8000">
              <button class="s" style="padding:10px 14px;white-space:nowrap" onclick="saveBackendUrl()">Save</button>
            </div>
            <button class="s" style="width:100%;margin-top:8px" onclick="testBackendConnection()">⚡ Test Backend Connection</button>
            <div id="backend-test-res" style="margin-top:8px;font-size:13.5px"></div>
          </div>

          <div class="card">
            <p><b>Microphone & Server</b></p>
            <p class="mu">Web Speech API runs best on <code>http://localhost:8000</code> or HTTPS. Microphone works with 100% full support on HTTPS and <code>http://localhost:8000</code>.</p>
            <button class="s" style="width:100%" onclick="showMicHelp()">🎤 Mic Diagnostics & Fix</button>
          </div>

          <div class="card">
            <p class="mu">Your progress is saved both in browser and Supabase cloud.</p>
            <button class="s" onclick="if(confirm('Reset everything?')){localStorage.removeItem(K);location.reload()}">Reset progress</button>
          </div>`;
      };

      async function manualCloudBackup() {
        const ok = await syncToSupabaseCloud();
        alert("✅ Supabase Cloud mein aapka data successfully backup ho gaya!");
        R.set();
      }

      async function manualCloudRestore() {
        if (!confirm("Supabase Cloud se purana data restore karein?")) return;
        const data = await loadFromSupabaseCloud();
        if (data) {
          alert(`✅ Restored from Supabase! Welcome back, ${S.name || 'Student'}! Streak: ${S.streak} days, Words: ${S.words.length}`);
          go(view);
        } else {
          alert("Could not load from Supabase Cloud. Check internet connection.");
        }
      }

      async function testSupabaseConnection() {
        const out = $("#supabase-test-res");
        if (!out) return;
        out.innerHTML = "Connecting to Supabase...";
        try {
          const testUrl = `${SUPABASE_CONFIG.url}/storage/v1/object/public/bolo_cloud/test_sync.json`;
          const res = await fetch(testUrl);
          if (res.ok) {
            out.innerHTML = `<p style="color:var(--ok);margin:4px 0"><b>✅ Supabase Connected Successfully!</b><br>Project URL: <code>${SUPABASE_CONFIG.url}</code><br>Bucket: <code>bolo_cloud</code> (Public Verified)</p>`;
          } else {
            out.innerHTML = `<p style="color:var(--bad);margin:4px 0">Connection status: ${res.status}</p>`;
          }
        } catch (e) {
          out.innerHTML = `<p style="color:var(--bad);margin:4px 0">Error: ${esc(e.message)}</p>`;
        }
      }

      window.manualCloudBackup = manualCloudBackup;
      window.manualCloudRestore = manualCloudRestore;
      window.testSupabaseConnection = testSupabaseConnection;

      function toggleKeyVisibility() {
        const inp = $("#gemini-key-input");
        if (inp) {
          inp.type = inp.type === "password" ? "text" : "password";
        }
      }
      function saveGeminiKey() {
        const inp = $("#gemini-key-input");
        if (inp) {
          S.geminiKey = inp.value.trim();
          save();
          alert("Gemini API Key saved!");
          R.set();
        }
      }
      async function testGeminiConnection() {
        const out = $("#gemini-test-res");
        if (!out) return;
        out.innerHTML = "Connecting to Google Gemini...";
        const res = await callGeminiApi('Reply in 1 short sentence: "Gemini connection is working!"');
        if (res && res.reply) {
          out.innerHTML = `<p style="color:var(--ok);margin:4px 0"><b>✅ Connected Successfully!</b><br>Gemini: "${esc(res.reply)}"</p>`;
        } else {
          out.innerHTML = `<p style="color:var(--bad);margin:4px 0"><b>❌ Connection failed.</b> Please check internet or key.</p>`;
        }
      }
      async function testBackendConnection() {
        const out = $("#backend-test-res");
        if (!out) return;
        out.innerHTML = "Connecting to Backend API Server...";
        try {
          const res = await fetch(getApiUrl("/"));
          if (res.ok) {
            const data = await res.json();
            out.innerHTML = `<p style="color:var(--ok);margin:4px 0"><b>✅ Backend Server Online!</b><br>Service: ${esc(data.service)}<br>Supabase: ${data.supabaseReady ? '✅ Ready' : '❌ Not configured'} | Gemini: ${data.geminiReady ? '✅ Ready' : '❌ Not configured'}</p>`;
          } else {
            out.innerHTML = `<p style="color:var(--bad);margin:4px 0">Status code: ${res.status}</p>`;
          }
        } catch (e) {
          out.innerHTML = `<p style="color:var(--bad);margin:4px 0">Cannot connect: ${esc(e.message)}</p>`;
        }
      }
      function saveBackendUrl() {
        const inp = $("#backend-url-input");
        if (inp) {
          S.backendUrl = inp.value.trim().replace(/\/+$/, "");
          save();
          alert("Backend Server URL saved!");
          R.set();
        }
      }
      window.toggleKeyVisibility = toggleKeyVisibility;
      window.saveGeminiKey = saveGeminiKey;
      window.testGeminiConnection = testGeminiConnection;
      window.saveBackendUrl = saveBackendUrl;
      window.testBackendConnection = testBackendConnection;

      // ---------- AI CONVERSATION (TEXT & TAP CHAT) ----------
      let C = { k: "free", msgs: [], busy: false, sample: null };

      // Built-in Intelligent Dialogue & Grammar Engine for Standalone Browsers
      function generateLocalAiTurn(userText, scKey) {
        const text = (userText || "").toLowerCase();
        let correction = null;

        // Common Indian Learner English Grammar Checks
        if (text.includes("i am go") || text.includes("i am come")) {
          correction = { wrong: "I am go", right: "I am going", tip_hi: "'am' ke baad verb me 'ing' lagta hai: I am going." };
        } else if (text.includes("he have") || text.includes("she have")) {
          correction = { wrong: "He/She have", right: "He/She has", tip_hi: "He/She/It ke saath hamesha 'has' use hota hai." };
        } else if (text.includes("i am agree")) {
          correction = { wrong: "I am agree", right: "I agree", tip_hi: "'Agree' khud ek kriya (verb) hai, 'am' ki zaroorat nahi hoti." };
        } else if (text.includes("didn't went") || text.includes("did not went")) {
          correction = { wrong: "did not went", right: "did not go", tip_hi: "'Did' ke saath hamesha first form of verb (go) aati hai." };
        } else if (text.includes("myself ") && text.indexOf("myself") === 0) {
          correction = { wrong: "Myself...", right: "My name is... / I am...", tip_hi: "Interview ya introduction me 'My name is' kehna zyada formal hai." };
        } else if (text.includes("today morning")) {
          correction = { wrong: "today morning", right: "this morning", tip_hi: "Aaj subah ke liye 'this morning' sahi expression hai." };
        } else if (text.includes("yesterday night")) {
          correction = { wrong: "yesterday night", right: "last night", tip_hi: "Kal raat ke liye 'last night' bolna behtar hai." };
        }

        const repliesByScenario = {
          free: [
            "That's really interesting! Tell me, what do you usually like doing on weekends?",
            "Nice to know! Which programming language do you enjoy working on the most?",
            "Sounds great! How do you spend your free time with your college friends?",
            "I see! What is your favorite movie or TV series that you watched recently?"
          ],
          riya: [
            "Totally agree! College life is hectic but fun. What subject are you studying today?",
            "That sounds awesome! Did you hang out at the canteen or library today?",
            "Haha, same here! What are your plans after classes finish?"
          ],
          vikram: [
            "Thank you for sharing that. Can you tell me about a challenging project you have worked on?",
            "Good. What are your key technical strengths, and how do you handle teamwork?",
            "Impressive. Where do you see yourself professionally in the next three years?",
            "Why do you think we should hire you for this role as a software fresher?"
          ],
          class: [
            "Yes, exactly! Have you completed the latest assignment given by the professor?",
            "I agree. Are you planning to prepare for the upcoming semester exams together?",
            "Good point! What did you think about today's morning lecture?",
            "Definitely! Let's go to the college library to study this topic."
          ],
          prof: [
            "Good question. Always make sure to write clean, modular code. What specific doubt do you have?",
            "I appreciate your curiosity. Have you gone through the textbook chapter on this concept?",
            "Very well said. Make sure to submit your lab record before the deadline."
          ],
          hr: [
            "Thank you for sharing that. Can you tell me about a challenging project you have worked on?",
            "Great! What are your key technical strengths, and how do you handle teamwork?",
            "Impressive. Where do you see yourself professionally in the next three years?"
          ],
          shop: [
            "Welcome! Would you like to see our menu or order drinks first?",
            "Sure, that will take around ten minutes. Would you like anything else with that?",
            "Certainly! Here is your bill. Would you prefer paying with UPI or cash?"
          ],
          kabir: [
            "Coming right up! Would you like sugar with your coffee or snacks?",
            "Great choice! Do you often visit this area of the city?"
          ],
          priya: [
            "Very good attempt! Every small conversation improves your confidence. What do you like doing in free time?",
            "That's wonderful! Keep speaking boldly without any fear of mistakes."
          ],
          chal: [
            "Good effort on your daily challenge speech! What was the main lesson you learned today?",
            "You spoke clearly and confidently! Keep practicing like this every day."
          ]
        };

        const pool = repliesByScenario[scKey] || repliesByScenario.free;
        const reply = pool[Math.floor(Math.random() * pool.length)];
        return { reply, correction, hint_hi: "Tip: Ek do sentences me natural jawab dein." };
      }

      R.chat = async (k) => {
        C = { k: k || "free", msgs: [], busy: false, sample: C.sample };
        const sc = SC[C.k] || ["Speaking challenge", ""];
        A.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h1>${esc(sc[0])}</h1>
            <span class="badge" style="cursor:pointer" onclick="go('set')" title="Click to manage AI Mode">
              ${S.aiMode === "gemini" ? "✨ Gemini AI" : "🏠 Local AI"}
            </span>
          </div>
          <div id="log"></div>
          <div id="fb"></div>
          <button class="mic" id="mic" onclick="chatMic()">🎤</button>
          <p class="mu" style="text-align:center;min-height:24px" id="st">Tap & Speak</p>
          <input id="tp" placeholder="Type your message in English here..." onkeydown="if(event.key==='Enter'){chatSend(this.value);this.value=''}">
          <button style="width:100%;margin-top:8px" onclick="chatSend($('#tp').value);$('#tp').value=''">Send ➤</button>
        `;

        try {
          if (typeof claude !== "undefined" && claude.use) {
            C.sample = C.sample || (await claude.use("sample"));
          }
        } catch (e) {}

        S.convos++;
        save();
        aiTurn(
          C.k === "chal"
            ? "Start: give me the day challenge topic and ask me to speak."
            : "Start the conversation with a short greeting and one easy question.",
        );
      };

      function sys() {
        const sc = SC[C.k] || [
          "",
          "a speaking coach giving a timed speaking challenge",
        ];
        const hin =
          S.level <= 1
            ? "Give hints in Hinglish (Hindi in Roman script)."
            : "Use little Hindi.";
        return `You are a friendly senior + English teacher + speaking partner for ${S.name || "a student"}, a B.Tech CSE student (level ${LV[Math.min(S.level, 5)]}, goal ${S.goal}). Role: ${sc[1]}. Rules: reply in 1-2 SHORT simple English sentences and ask one follow-up question. Never insult; be warm, not over-praising. If the student's last message has an important mistake, give ONE correction (most important only). ${hin} If they seem stuck, give a sentence starter hint. Output ONLY JSON: {"reply":"...","correction":null or {"wrong":"...","right":"...","tip_hi":"short Hinglish tip"},"hint_hi":"short Hinglish hint or empty"}`;
      }

      async function aiTurn(userText) {
        if (C.busy) return;
        C.busy = true;
        $("#st").textContent = S.aiMode === "gemini" ? "✨ Gemini AI is thinking..." : "AI is thinking...";

        let j = null;

        // 1. Try Gemini AI Mode if active
        if (S.aiMode === "gemini" && S.geminiKey) {
          const geminiPrompt =
            sys() +
            '\n\nConversation history (learner lines start with "Learner:", you are "AI:"):\n' +
            C.msgs.map((m) => (m.r === "ai" ? "AI: " : "Learner: ") + m.t).join("\n") +
            "\nLearner: " +
            userText;

          try {
            j = await callGeminiApi(geminiPrompt);
          } catch (e) {
            console.warn("Gemini call error:", e);
          }
        }

        // 2. Try Claude sample if available
        if (!j && C.sample) {
          try {
            j = await C.sample.json(
              [
                {
                  role: "user",
                  content:
                    sys() +
                    '\n\nConversation (learner lines start with "Learner:"):\n' +
                    C.msgs
                      .map((m) => (m.r === "ai" ? "You: " : "Learner: ") + m.t)
                      .join("\n") +
                    "\nLearner: " +
                    userText,
                },
              ],
              { cache: false },
            );
          } catch (e) {}
        }

        // 3. Fallback to Local AI Dialogue Engine
        if (!j) {
          await new Promise((r) => setTimeout(r, 350));
          if (C.msgs.length === 0) {
            const greetings = {
              free: `Hello ${S.name || "there"}! Great to see you. How is your day going?`,
              class: `Hey ${S.name || "friend"}! Did you finish working on the assignment?`,
              prof: `Good day ${S.name || "student"}. What topic are you working on today?`,
              hr: `Hello ${S.name || "candidate"}, welcome to your interview. Could you please introduce yourself?`,
              shop: `Hello! Welcome to our cafe. How may I help you today?`,
              chal: `Welcome to today's challenge! Please share your thoughts on the topic.`
            };
            j = {
              reply: greetings[C.k] || `Hello ${S.name || "friend"}! What would you like to talk about today?`,
              correction: null,
              hint_hi: "Bolna shuru karein!",
            };
          } else {
            j = generateLocalAiTurn(userText, C.k);
          }
        }

        C.busy = false;
        const log = $("#log");
        if (log && j) {
          if (j.correction && j.correction.wrong) {
            addMist(
              j.correction.wrong,
              j.correction.right,
              j.correction.tip_hi,
            );
            log.insertAdjacentHTML(
              "beforeend",
              `<div class="fix">Good try! 👍 Small correction:<br>❌ ${esc(j.correction.wrong)}<br>✅ <b>${esc(j.correction.right)}</b><br><span class="mu">${esc(j.correction.tip_hi || "")}</span> <button class="s" style="padding:4px 10px" onclick="speak('${esc(j.correction.right).replace(/'/g, "\\'")}')">🔊</button></div>`,
            );
          }
          C.msgs.push({ r: "ai", t: j.reply });
          log.insertAdjacentHTML(
            "beforeend",
            `<div class="bub ai">${esc(j.reply)}<div class="row" style="margin-top:6px"><button class="s" style="padding:4px 10px" onclick="speak(this.dataset.t)" data-t="${esc(j.reply)}">🔊 Replay</button><button class="s" style="padding:4px 10px" onclick="speak(this.dataset.t,.6)" data-t="${esc(j.reply)}">🐢 Slow</button></div></div>`,
          );
          if ($("#fb")) {
            $("#fb").innerHTML = j.hint_hi
              ? `<p class="fix">💡 ${esc(j.hint_hi)}</p>`
              : "";
          }
          if ($("#st")) $("#st").textContent = "Tap & Speak";
          speak(j.reply);
          window.scrollTo(0, document.body.scrollHeight);
        }
      }

      function chatSend(t) {
        if (!t) return;
        t = t.trim();
        if (!t) return;
        S.sent++;
        save();
        $("#log").insertAdjacentHTML(
          "beforeend",
          `<div class="bub me">${esc(t)}</div>`,
        );
        const prev = t;
        aiTurn(t).then(() => {});
        C.msgs.push({ r: "me", t: prev });
      }

      function chatMic() {
        listen(
          (t) => chatSend(t),
          (s) => {
            $("#mic") && $("#mic").classList.toggle("rec", s === "rec");
            const st = $("#st");
            if (!st || C.busy) return;
            st.textContent = stMsg(s);
          },
        );
      }

      window.chatSend = chatSend;
      window.chatMic = chatMic;
      window.drillMic = drillMic;
      window.drillCheck = drillCheck;
      window.D = D;
      Object.defineProperty(window, "D", {
        get: () => D,
        set: (v) => {
          D = v;
        },
      });
      window.S = S;

      (async function initApp() {
        await BoloAuth.init();

        const initialHash = (window.location.hash || "").replace(/^#/, "");
        let targetView = "grammar";
        let targetArg = null;

        if (initialHash) {
          const initialResolved = resolveRouteName(initialHash);
          targetView = initialResolved.view;
          targetArg = initialResolved.arg;
        } else {
          targetView = BoloAuth.isVerified() ? "grammar" : "login";
        }

        go(targetView, targetArg);
        checkProtocolBanner();
      })();
    </script>
